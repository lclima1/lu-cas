const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
let TD = { open: null, del: null, msg: "" };

function studentSummary(nLog) {
  const days = {}; for (let i = 0; i < 14; i++) { const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); if (P.time.days[k]) days[k] = P.time.days[k]; }
  const tr = P.track === "read" ? "read" : "ear", nx = nextIndex(tr);
  return { sid: P.student.sid, nick: P.student.nick, joined: P.student.joined, last: Date.now(), xp: P.xp, total: P.time.total, days,
    done: Object.keys(P.book.done).length, next: bkNextIdx() >= 0 ? BK_LESSONS[bkNextIdx()].id : null,
    log: P.log.slice(-(nLog || 20)).map(e => ({ id: e.id, t: e.t, stars: e.stars, test: e.test, acc: e.acc, xp: e.xp, secs: e.secs })) };
}
function syncStudent() { if (P.student) Cloud.push(studentSummary(), P.student.code); }
function reportLink() {
  const s = studentSummary(8), dd = []; for (let i = 0; i < 14; i++) { const d = new Date(); d.setDate(d.getDate() - i); dd.push(Math.round((s.days[dayKey(d)] || 0) / 60)); }
  const pack = { v: 1, c: P.student.code, n: P.student.cls, sid: s.sid, nk: s.nick, j: s.joined, l: Math.round(s.last / 60000), x: s.xp, tt: s.total, dd, dn: s.done, nx: s.next,
    lg: s.log.map(e => [e.id, Math.round(e.t / 60000), e.stars != null ? e.stars : e.test, e.acc, e.xp, e.secs]) };
  return appBase() + "#report=" + b64e(JSON.stringify(pack));
}
function unpackReport(pk) {
  const days = {}, base = new Date(pk.l * 60000);
  (pk.dd || []).forEach((m, i) => { if (m) { const d = new Date(base); d.setDate(d.getDate() - i); days[dayKey(d)] = m * 60; } });
  return { code: pk.c, cls: pk.n, sum: { sid: pk.sid, nick: pk.nk, joined: pk.j, last: pk.l * 60000, xp: pk.x, total: pk.tt, days, done: pk.dn, next: pk.nx,
    log: (pk.lg || []).map(([id, tm, st, acc, xp, secs]) => ({ id, t: tm * 60000, stars: typeof st === "number" ? st : undefined, test: typeof st === "string" ? st : undefined, acc, xp, secs })) } };
}
function lessonName(id) {
  const bl = id && bkFind(id); if (bl) return "Ch. " + bl.chap.n + " · " + bkTitle(bl);
  const l = id && findLesson(id); if (!l) return "–";

function ago(ts) {

  const n = Math.round((b - a) / 86400000); return n <= 0 ? t("today") : n === 1 ? t("yesterday") : t("daysAgo", { n });
}
function sumDays(days, n) { let tot = 0; for (let i = 0; i < n; i++) { const d = new Date(); d.setDate(d.getDate() - i); tot += (days || {})[dayKey(d)] || 0; } return tot; }

function boot() {
  const h = new URLSearchParams(BETA ? "" : location.hash.slice(1));
  if (h.get("capy")) return clsLinkIn(h.get("capy"));
  if (h.get("report")) {
    let msg;
    try {
      const r = unpackReport(JSON.parse(b64d(h.get("report"))));
      msg = Cloud.push(r.sum, r.code) ? t("imported", { n: r.sum.nick, c: r.cls || r.code }) : t("importUnknown");
    } catch (e) { msg = t("importUnknown"); }
    history.replaceState(null, "", location.href.split("#")[0]);

    return renderJoin(q);
  }

}

/* ===================== Capy · the book: score renderer ===================== */
const SHARP_STEPS = [38, 35, 39, 36, 33, 37, 34], FLAT_STEPS = [34, 37, 33, 36, 32, 35, 31];
const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6], FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3];   // letter indexes (C=0)
const keyAcc = (key, l) => key > 0 ? (SHARP_ORDER.slice(0, key).includes(l) ? 1 : 0) : key < 0 ? (FLAT_ORDER.slice(0, -key).includes(l) ? -1 : 0) : 0;
const stepOf = sp => (sp.o + 1) * 7 + sp.l;   // written an octave higher: E4 bottom line = 30
const GL = {
  sharp: (x, y, c) => `<g stroke="${c}" stroke-linecap="butt"><line x1="${x - 2}" y1="${y - 8}" x2="${x - 2}" y2="${y + 9}" stroke-width="1.3"/><line x1="${x + 2}" y1="${y - 9}" x2="${x + 2}" y2="${y + 8}" stroke-width="1.3"/><line x1="${x - 4.5}" y1="${y - 2}" x2="${x + 4.5}" y2="${y - 4}" stroke-width="2.6"/><line x1="${x - 4.5}" y1="${y + 4}" x2="${x + 4.5}" y2="${y + 2}" stroke-width="2.6"/></g>`,

  natural: (x, y, c) => `<g stroke="${c}"><line x1="${x - 3}" y1="${y - 10}" x2="${x - 3}" y2="${y + 4}" stroke-width="1.3"/><line x1="${x + 3}" y1="${y - 4}" x2="${x + 3}" y2="${y + 10}" stroke-width="1.3"/><line x1="${x - 3}" y1="${y - 2}" x2="${x + 3}" y2="${y - 4}" stroke-width="2.4"/><line x1="${x - 3}" y1="${y + 4}" x2="${x + 3}" y2="${y + 2}" stroke-width="2.4"/></g>`,
  qrest: (x, y, c) => `<path d="M${x - 2} ${y - 10} L${x + 3} ${y - 4} L${x - 1.5} ${y + 1} L${x + 3.5} ${y + 7} C${x - 1} ${y + 4} ${x - 4} ${y + 7} ${x - 1} ${y + 11} C${x - 7} ${y + 7} ${x - 3} ${y + 2} ${x + 1} ${y + 4} L${x - 3} ${y - 2} L${x + 1} ${y - 7}z" fill="${c}"/>`,
  erest: (x, y, c) => `<g fill="${c}"><circle cx="${x - 2}" cy="${y - 3}" r="2.4"/><path d="M${x - 2} ${y - 1} Q${x + 1} ${y} ${x + 4} ${y - 5} L${x + 4.6} ${y - 4} L${x - .5} ${y + 9} L${x - 1.8} ${y + 8.5} L${x + 2.6} ${y - 1.6} Q${x} ${y + .4} ${x - 2} ${y - 1}z"/></g>`

/* it: { meter, pick, key, voices, play, app }
   o:  { maxW, cur, done, names, lh, tim, mute:[voice idx], scale, fing, flats,

function bkScore(it, o) {
  o = o || {};
  const voices = BKC.voicesOf(it), meter = it.meter || [4, 4], ml = BKC.meterLen(meter), pick = it.pick || 0, key = it.key || 0;
  const play = it.play || [0], sev = o.sev || BKC.studentEvents(voices, play);
  const T = Math.max(...voices.map(BKC.total));
  const r3 = x => Math.round(x * 1000) / 1000;
  const evOf = new Map(); sev.forEach((x, i) => x.refs.forEach(([vi, k]) => evOf.set(vi + ":" + k, i)));
  const mute = new Set(o.mute || []);
  // staves: in a duet the partner's part gets its own staff; the higher part goes on top
  const used = voices.map((v, i) => v.some(e => e.p.length) ? i : -1).filter(i => i >= 0);
  const appV = used.filter(i => mute.has(i)), ownV = used.filter(i => !mute.has(i));
  const avg = vs => { const ms = vs.flatMap(i => voices[i].flatMap(e => e.p)); return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0; };
  const who = Object.assign({ app: "Capy", own: "You" }, o.who || {});
  let staves;
  if (o.split !== false && appV.length && ownV.length) staves = avg(appV) > avg(ownV) ? [{ vs: appV, app: true }, { vs: ownV }] : [{ vs: ownV }, { vs: appV, app: true }];
  else staves = [{ vs: used.length ? used : [0] }];
  const staffOf = {}; staves.forEach((S, si) => S.vs.forEach(v => staffOf[v] = si));
  voices.forEach((v, i) => { if (staffOf[i] == null) staffOf[i] = staves.length - 1; });
  const upOf = vi => { const S = staves[staffOf[vi]]; return S.vs.length > 1 ? S.vs.indexOf(vi) === 0 : null; };
  // measures
  const bounds = []; for (let b = pick > 1e-6 ? pick : ml; b < T - 1e-6; b += ml) bounds.push(r3(b));
  const mStart = [0].concat(bounds), mEnd = bounds.concat([r3(T)]);
  const measureOf = tt => { let k = 0; while (k < bounds.length && tt >= bounds[k] - 1e-6) k++; return k; };
  // columns
  const colMap = new Map();
  voices.forEach((v, vi) => v.forEach((e, k) => { const tt = r3(e.t); if (!colMap.has(tt)) colMap.set(tt, { t: tt, items: [] }); colMap.get(tt).items.push({ vi, k, e }); }));
  const cols = [...colMap.values()].sort((a, b) => a.t - b.t);
  // accidentals, per staff and measure
  const accState = staves.map(() => ({}));
  let curM = -1;
  cols.forEach(c => {
    const m = measureOf(c.t); if (m !== curM) { curM = m; accState.forEach(st => { for (const k in st) delete st[k]; }); }
    c.m = m; c.acc = false;
    c.items.forEach(z => {
      const st = accState[staffOf[z.vi]];
      const prev = z.k > 0 ? voices[z.vi][z.k - 1] : null, cont = prev && prev.tie && prev.p.join() === z.e.p.join();
      z.acc = z.e.sp.map(sp => {
        const id = sp.l + ":" + sp.o, cur = id in st ? st[id] : keyAcc(key, sp.l);
        if (cont) return null;

        return null;
      });
    });
  });
  // widths
  cols.forEach((c, i) => {
    const next = i < cols.length - 1 ? Math.min(cols[i + 1].t, mEnd[c.m]) : mEnd[c.m];
    const gap = Math.max(.25, next - c.t);
    const dense = o.maxW && o.maxW < 560;   // phones: tighter spacing, so that two bars fit on a line
    c.w = (dense ? 13 : 16) + (dense ? 20 : 26) * Math.sqrt(Math.min(gap, 4)) + (c.acc ? 11 : 0) + (c.items.some(x => [.75, 1.5, 3].includes(x.e.d)) ? 4 : 0);
  });
  const measures = mStart.map((s, m) => ({ m, s, e: mEnd[m], cols: cols.filter(c => c.m === m) }));
  measures.forEach(M => M.w = M.cols.reduce((a, c) => a + c.w, 0) + 12);
  const lab = staves.length > 1 ? 22 : 0;
  const head0 = lab + 40 + Math.abs(key) * 10 + 28, headN = lab + 40 + Math.abs(key) * 10 + 6;
  const maxW = o.maxW || 0, systems = [];
  let cur = { ms: [], w: head0 };
  measures.forEach(M => {
    if (maxW && cur.ms.length && cur.w + M.w > maxW) { systems.push(cur); cur = { ms: [], w: headN }; }
    cur.ms.push(M); cur.w += M.w;
  });
  systems.push(cur);
  // vertical extent of each staff
  staves.forEach(S => {
    let top = 14, bot = 14;
    S.vs.forEach(vi => voices[vi].forEach(e => e.sp.forEach(sp => {
      const st = stepOf(sp), u = upOf(vi), up = u == null ? st < 34 : u, stem = e.d < 4 ? 33 : 6;
      top = Math.max(top, (st - 38) * 5 + (up ? stem : 6) + 6);
      bot = Math.max(bot, (30 - st) * 5 + (!up ? stem : 6) + 6);
    })));
    if (o.fing && !S.app) top = Math.max(top, 26);
    if (o.lh && !S.app) bot = Math.max(bot, 22);
    S.top = top; S.bot = bot;
  });
  staves.forEach((S, si) => { if (si > 0) S.top = Math.max(S.top, 24); if (si < staves.length - 1) S.bot = Math.max(S.bot, 30); });
  const ownI = Math.max(0, staves.findIndex(S => !S.app));
  const txt = (o.names ? 16 : 0) + (o.tim ? 16 : 0);
  let acc0 = 0;
  staves.forEach((S, si) => { S.off = acc0 + S.top; acc0 += S.top + 40 + S.bot + (si === ownI ? txt : 0); });
  const sysH = acc0 + 12;
  const W = maxW ? Math.max(...systems.map(s => s.w), maxW) : systems[0].w + 10;
  const ink = "var(--ink)", colOk = "var(--ok)", colCur = "var(--yuzu)", colMute = o.plain ? ink : "var(--soft)";
  let g = "", posX = [];
  const ties = [], tl = [];   // timeline for the moving playhead: [time, x, system]
  systems.forEach((Sy, si) => {
    const ys = staves.map(S => si * sysH + S.off);
    const head = si === 0 ? head0 : headN;
    const natural = Sy.w, stretch = maxW && (si < systems.length - 1 || natural > maxW * .72) ? (maxW - head - 8) / (natural - head) : 1;
    const right = maxW ? (stretch !== 1 ? maxW - 6 : natural) : natural;
    staves.forEach((S, k) => {
      const y0 = ys[k], dim = S.app && !o.plain;
      for (let q = 0; q < 5; q++) g += `<line x1="${4 + lab}" x2="${right}" y1="${y0 + q * 10}" y2="${y0 + q * 10}" stroke="${ink}" stroke-width="1" opacity="${dim ? .4 : .7}"/>`;
      g += `<g transform="translate(${10 + lab},${y0})" opacity="${dim ? .55 : 1}"><path d="${CLEF}" fill="none" stroke="${ink}" stroke-width="2.3" stroke-linecap="round"/><circle cx="9.6" cy="51" r="2.8" fill="${ink}"/><text x="9" y="66" text-anchor="middle" style="font:700 10px Nunito,sans-serif;fill:${ink}">8</text></g>`;
      for (let q = 0; q < Math.abs(key); q++) { const st = key > 0 ? SHARP_STEPS[q] : FLAT_STEPS[q], x = lab + 42 + q * 10, yy = y0 + (38 - st) * 5; g += key > 0 ? GL.sharp(x, yy, ink) : GL.flat(x, yy, ink); }
      if (si === 0) { const tx = lab + 44 + Math.abs(key) * 10 + 8; g += `<text x="${tx}" y="${y0 + 17}" text-anchor="middle" style="font:700 19px Fredoka,sans-serif;fill:${ink}">${meter[0]}</text><text x="${tx}" y="${y0 + 37}" text-anchor="middle" style="font:700 19px Fredoka,sans-serif;fill:${ink}">${meter[1]}</text>`; }
      if (lab) g += `<text x="11" y="${y0 + 20}" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 11 ${y0 + 20})" style="font:800 10.5px Nunito,sans-serif;fill:${S.app ? (o.plain ? ink : "var(--soft)") : "var(--yuzuD)"}">${esc(S.app ? who.app : who.own)}</text>`;
    });
    const yTop = ys[0], yBot = ys[ys.length - 1] + 40;
    if (staves.length > 1) g += `<line x1="${4 + lab}" x2="${4 + lab}" y1="${yTop}" y2="${yBot}" stroke="${ink}" stroke-width="1.6"/>`;
    let x = head;
    Sy.ms.forEach((M, mi) => {
      M.cols.forEach(c => {
        c.x = x + 10; c.sys = si; x += c.w * stretch; tl.push([c.t, c.x, si]);
        const evIdx = c.items.map(z => evOf.get(z.vi + ":" + z.k)).find(v => v != null);
        if (evIdx != null) posX[evIdx] = { x: c.x, sys: si, y: ys[ownI], top: si * sysH };
        if (evIdx != null && evIdx === o.cur) g += `<rect x="${c.x - 13}" y="${ys[ownI] - 16}" width="26" height="72" rx="10" fill="var(--yuzu)" opacity=".13"/>`;
        if (o.range && c.t >= o.range[0] - 1e-6 && c.t < o.range[1] - 1e-6) { Sy.hl = Sy.hl || [Infinity, -Infinity]; Sy.hl[0] = Math.min(Sy.hl[0], c.x); Sy.hl[1] = Math.max(Sy.hl[1], c.x); }
      });
      x += 12 * stretch;
      const last = si === systems.length - 1 && mi === Sy.ms.length - 1;
      if (mi === Sy.ms.length - 1) tl.push([M.e - 1e-6, x - 6, si]);
      const bar = (y1, y2) => last ? `<line x1="${x - 8}" x2="${x - 8}" y1="${y1}" y2="${y2}" stroke="${ink}" stroke-width="1.2"/><line x1="${x - 4}" x2="${x - 4}" y1="${y1}" y2="${y2}" stroke="${ink}" stroke-width="3.2"/>` : `<line x1="${x - 4}" x2="${x - 4}" y1="${y1}" y2="${y2}" stroke="${ink}" stroke-width="1.2"/>`;
      g += staves.length > 1 ? bar(yTop, yBot) : bar(yTop, yTop + 40);
    });
    Sy.ys = ys; Sy.right = right;
    if (Sy.hl) g += `<rect x="${Sy.hl[0] - 18}" y="${si * sysH + 4}" width="${Sy.hl[1] - Sy.hl[0] + 36}" height="${sysH - 10}" rx="12" fill="var(--yuzu)" opacity=".09"/>`;
  });
  // notes, voice by voice
  voices.forEach((v, vi) => {
    const sIdx = staffOf[vi], uFixed = upOf(vi), isMute = mute.has(vi);
    if (!v.some(x => x.p.length)) return;
    const bw = meter[0] === 4 ? 2 : meter[0];   // beam eighths within half a 4/4 bar, or a whole 2/4 or 3/4 bar
    const groups = []; let gr = null;
    v.forEach((e, k) => {
      const beat = Math.floor((e.t - pick + 1e-6) / bw) * bw + pick, short = e.p.length && e.d <= .5 + 1e-6;
      const sameSys = gr && colMap.get(r3(v[gr.ks[gr.ks.length - 1]].t)).sys === colMap.get(r3(e.t)).sys;
      if (short && gr && sameSys && Math.abs(gr.beat - beat) < 1e-6 && gr.ks[gr.ks.length - 1] === k - 1 && e.t < beat + bw - 1e-6) gr.ks.push(k);
      else { if (gr && gr.ks.length > 1) groups.push(gr); gr = short ? { beat, ks: [k] } : null; }
    });
    if (gr && gr.ks.length > 1) groups.push(gr);
    const inGroup = new Map(); groups.forEach(G => G.ks.forEach(k => inGroup.set(k, G)));
    const info = [];
    v.forEach((e, k) => {
      const c = colMap.get(r3(e.t)), y0 = systems[c.sys].ys[sIdx], Y = st => y0 + (38 - st) * 5;
      const evIdx = evOf.get(vi + ":" + k);
      const outside = o.range && (e.t < o.range[0] - 1e-6 || e.t >= o.range[1] - 1e-6);
      const col = outside ? "var(--dim, #b4ac9f)" : isMute ? colMute : evIdx != null && o.done != null && evIdx < o.done && evIdx >= (o.doneFrom || 0) ? colOk : evIdx != null && evIdx === o.cur ? colCur : ink;
      if (!e.p.length) {   // rest

        if (uFixed != null) {   // keep clear of the other voice's notes in the same column

          if (other.length) off = uFixed ? Math.min(off, Math.min(...other) - 20 - y0 - 12) : Math.max(off, Math.max(...other) - 20 - y0 + 14);
        }
        const whole = Math.abs(e.d - ml) < 1e-6 || e.d >= 4, ry = y0 + 20 + off;
        if (whole) g += `<rect x="${c.x - 6}" y="${y0 + 10 + Math.min(0, off)}" width="12" height="5" fill="${col}"/>`;
        else if (e.d >= 2) g += `<rect x="${c.x - 6}" y="${y0 + 15 + off}" width="12" height="5" fill="${col}"/>${e.d === 3 ? `<circle cx="${c.x + 10}" cy="${y0 + 17 + off}" r="1.8" fill="${col}"/>` : ""}`;
        else if (e.d >= 1) g += GL.qrest(c.x, ry, col);
        else g += GL.erest(c.x, ry, col);
        info.push(null); return;
      }
      const steps = e.sp.map(stepOf), ysN = steps.map(Y);
      const up = uFixed == null ? (steps.reduce((a, b) => a + b, 0) / steps.length) < 34 : uFixed;
      const lo = Math.min(...steps), hi = Math.max(...steps);
      for (let s = 28; s >= lo; s -= 2) g += `<line x1="${c.x - 11}" x2="${c.x + 11}" y1="${Y(s)}" y2="${Y(s)}" stroke="${ink}" stroke-width="1.2"/>`;
      for (let s = 40; s <= hi; s += 2) g += `<line x1="${c.x - 11}" x2="${c.x + 11}" y1="${Y(s)}" y2="${Y(s)}" stroke="${ink}" stroke-width="1.2"/>`;
      const z = c.items.find(q => q.vi === vi && q.k === k);
      steps.forEach((st, j) => {
        const y = ysN[j], seconds = steps.some((s2, j2) => j2 < j && Math.abs(s2 - st) === 1), nx = c.x + (seconds ? (up ? 11 : -11) : 0);
        const filled = e.d < 2;
        g += `<ellipse cx="${nx}" cy="${y}" rx="6.3" ry="4.6" transform="rotate(-20 ${nx} ${y})" fill="${filled ? col : "var(--card)"}" stroke="${col}" stroke-width="${filled ? 0 : 2}"/>`;
        const a = z && z.acc ? z.acc[j] : null;
        if (a != null) g += a > 0 ? GL.sharp(c.x - 15, y, col) : a < 0 ? GL.flat(c.x - 15, y + 1, col) : GL.natural(c.x - 15, y, col);

      });
      const inf = { c, up, ys: ysN, col, d: e.d, y0, sx: up ? c.x + 5.6 : c.x - 5.6 };
      inf.tip = up ? Math.min(...ysN) - 32 : Math.max(...ysN) + 32;
      inf.base = up ? Math.max(...ysN) : Math.min(...ysN);
      info.push(inf);
      if (e.tie) ties.push({ vi, k, up, ys: ysN, c, col });

        const pl = e.p.map(m => BKC.place(m)).filter(Boolean);
        g += `<text x="${c.x + (up ? -9 : 9)}" y="${(up ? Math.max(...ysN) + 16 : Math.min(...ysN) - 9)}" text-anchor="middle" style="font:700 10px Nunito,sans-serif;fill:var(--blue)">${pl.map(p => p.f).join("·")}</text>`;

        G.ks.forEach((j, n) => { if (v[j].d <= .25 + 1e-6) { const m = info[j], nx2 = n < G.ks.length - 1 ? info[G.ks[n + 1]].sx : m.sx - 8; g += `<rect x="${Math.min(m.sx, nx2)}" y="${up ? tip + 8 : tip - 13}" width="${Math.abs(nx2 - m.sx) + 1.4}" height="4" fill="${col}"/>`; } });
        return;
      }
      g += `<line x1="${inf.sx}" x2="${inf.sx}" y1="${inf.base}" y2="${inf.tip}" stroke="${inf.col}" stroke-width="1.5"/>`;
      const fl = e.d <= .25 + 1e-6 || e.d === .375 ? 2 : e.d <= .75 + 1e-6 ? 1 : 0;
      for (let n = 0; n < fl; n++) { const ty = inf.tip + (inf.up ? 1 : -1) * n * 7; g += inf.up ? `<path d="M${inf.sx} ${ty} c1 7 9 8 7 19 c-1 -7 -4 -9 -7 -11z" fill="${inf.col}"/>` : `<path d="M${inf.sx} ${ty} c1 -7 9 -8 7 -19 c-1 7 -4 9 -7 11z" fill="${inf.col}"/>`; }
    });
  });

  ties.forEach(tt => {
    const v = voices[tt.vi], nxt = v[tt.k + 1]; if (!nxt) return;
    const c2 = colMap.get(r3(nxt.t)), tc = tt.col === colMute ? colMute : ink;

      const dy = tt.up ? 7 : -7, x1 = tt.c.x + 4;
      if (c2.sys === tt.c.sys) { const x2 = c2.x - 4; g += `<path d="M${x1} ${y + dy} Q${(x1 + x2) / 2} ${y + dy * 2.2} ${x2} ${y + dy}" fill="none" stroke="${tc}" stroke-width="1.4"/>`; }
      else { const x2 = systems[tt.c.sys].right - 4; g += `<path d="M${x1} ${y + dy} Q${(x1 + x2) / 2} ${y + dy * 2.2} ${x2} ${y + dy * 1.6}" fill="none" stroke="${tc}" stroke-width="1.4"/>`; }
    });
  });
  // names and timing marks under the learner's staff
  const ownS = staves[ownI];
  sev.forEach((x, i) => {
    const p = posX[i]; if (!p) return;
    const base = p.y + 40 + ownS.bot;
    if (o.range && (x.t < o.range[0] - 1e-6 || x.t >= o.range[1] - 1e-6)) return;
    if (o.names) g += `<text x="${p.x}" y="${base + 2}" text-anchor="middle" style="font:700 11px Nunito,sans-serif;fill:${o.done != null && i < o.done && i >= (o.doneFrom || 0) ? colOk : "var(--ink)"}">${esc(x.p.slice().reverse().map(m => BKC.NAME(BKC.spell(m, key < 0 || o.flats))).join("/"))}</text>`;
    if (o.tim && o.tim[i] && o.tim[i] !== "ok") g += `<text x="${p.x}" y="${base + (o.names ? 18 : 4)}" text-anchor="middle" style="font:800 11px Fredoka,sans-serif;fill:var(--bad)">${o.tim[i] === "short" ? "too short" : "too long"}</text>`;
  });
  const H = systems.length * sysH;
  const sc = o.scale || 1;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W * sc)}" height="${Math.round(H * sc)}" role="img" aria-label="Music notation">${g}</svg>`, posX, W, H, sev, staves: staves.length, tl: tl.sort((a, b) => a[0] - b[0]), sysH };

/* ---------------- Capy's journey: a quiz for every place, a celebration for every chapter ---------------- */
let QZ = null;
function bkQuiz(n) {
  const c = BOOK.CH[n - 1]; if (!c || !c.place) return bkChapter(n);
  const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  QZ = { n, k: 0, right: 0, qs: c.place.quiz.map(q => { const idx = shuffle((q.map || q.o).map((_, i) => i)); return Object.assign({}, q, { order: idx }); }), ans: null };
  bkQuizShow();
}
function bkQuizShow() {
  Voice.stop(); screen = "bkquiz";
  const c = BOOK.CH[QZ.n - 1], q = QZ.qs[QZ.k], A = "ABC";
  let body = "";
  if (q.map) {
    const pins = q.order.map((oi, j) => ({ lon: q.map[oi][0], lat: q.map[oi][1], label: A[j], hl: QZ.ans != null && oi === q.a }));
    body = bkMapOf(pins, "Map") + `<div class="qopts">${q.order.map((oi, j) => `<button class="btn ${QZ.ans == null ? "ghost" : oi === q.a ? "ok" : oi === QZ.ans ? "bad" : "ghost"}" data-act="bkqans" data-o="${oi}"${QZ.ans != null ? " disabled" : ""}>${A[j]}</button>`).join("")}</div>`;
  } else body = `<div class="qopts col">${q.order.map(oi => `<button class="btn ${QZ.ans == null ? "ghost" : oi === q.a ? "ok" : oi === QZ.ans ? "bad" : "ghost"}" data-act="bkqans" data-o="${oi}"${QZ.ans != null ? " disabled" : ""}>${esc(q.o[oi])}</button>`).join("")}</div>`;
  const fb = QZ.ans == null ? "" : `<div class="bubble ${QZ.ans === q.a ? "okb" : "adv"}"><p><b>${QZ.ans === q.a ? "Yes!" : "Not quite."}</b> ${esc(q.why || "")}</p></div><div class="pb" style="margin-top:14px"><button class="btn" data-act="bkqnext">${QZ.k + 1 < QZ.qs.length ? "Next question ▶" : "See my score"}</button></div>`;
  app.innerHTML = `<header class="hero">${topline(true)}</header><main class="lesson quiz">
    <p class="kick">Chapter ${QZ.n} · Quiz: ${esc(c.place.name)} · ${QZ.k + 1} of ${QZ.qs.length}</p>
    <div class="capyrow"><svg viewBox="0 0 160 120" aria-hidden="true">${capyG(QZ.ans == null ? "neutral" : QZ.ans === q.a ? "happy" : "oops")}</svg><div class="bubble l"><h3>${esc(q.q)}</h3></div></div>${body}${fb}
    <div class="pb" style="margin-top:12px"><button class="btn ghost small" data-act="bkchap" data-n="${QZ.n}">◀ Chapter ${QZ.n}</button></div></main>`;
}
function bkQuizEnd() {
  const c = BOOK.CH[QZ.n - 1], n = QZ.n, r = QZ.right, all = QZ.qs.length;
  P.book.quiz[n] = Math.max(P.book.quiz[n] || 0, r); saveP(); screen = "bkquizend";
  const next = BOOK.CH[n];
  app.innerHTML = `<main class="res">${capy(r === all ? "happy" : "neutral", "capybig")}<h1>${r} of ${all}</h1><h2 class="song">${esc(c.place.name)}</h2>

}

    "In my lessons I often begin with listening: what is music, which sounds can the guitar make, what do we hear around us? Reading comes after, as a way to remember and to share what we already know by ear.",
    "For me, a decolonial way of learning music means asking whose music we learn, how we learn it, and whose stories we tell. Guitar methods often present a European repertoire as if it were all of music. Here a march from Brazil, a children's song from Chile, a rowing song of the Gullah Geechee people, a flower song from China and a song from France stand side by side, each with the story of the place it comes from, including the hard stories, such as slavery, that are part of how this music travelled. Many of these songs were passed on by ear, from person to person: learning them by ear is a way of respecting how they lived.",

  const other = P.student && P.student.v && P.student.sid !== pk.sid;
  app.innerHTML = `<main class="res">${capy("happy", "capybig")}<h1>Hello, ${esc(pk.n)}!</h1>
    <div class="bubble"><p>${pk.s ? `In your lesson with ${esc(pk.t)}${pk.d ? " on " + esc(clsDay(pk.d)) : ""}, you stopped at:` : `${esc(pk.t)} connected Capiva to you.`}</p>${pk.s ? `<p class="cstop">${esc(clsName(pk.s))}</p><p class="say">Capiva continues from there.</p>` : ""}
    ${other ? `<p class="warnp">This app belongs to ${esc(P.student.name)} now. If you go on, it will belong to ${esc(pk.n)}.</p>` : ""}</div>
    <div class="pb" style="margin-top:18px"><button class="btn ghost" data-act="bkhome">Not now</button><button class="btn" data-act="clsaccept">This is me ▶</button></div></main>`;
}
function clsAccept() {
  const pk = CL; if (!pk) return bkHome();
  P.student = { v: 2, sid: pk.sid, name: pk.n, teacher: pk.t, stop: pk.s || null, d: pk.d || null };
  if (pk.s) clsSetStop(P.book, pk.s);
  P.book.about = true; P.onboarded = true; saveP(); CL = null;
  bkHome();
}

/* ---------- the teacher's device: students, lessons, the diary ---------- */
function clsTeacher() {
  Voice.stop(); screen = "clsteacher"; L = null;
  const d = TS.load(); if (!d.name && P.mark && P.mark.teacher) { d.name = P.mark.teacher; TS.save(d); }
  if (d.active) return clsEndScreen();
  const file = !/^https?:/.test(location.protocol);
  const rows = d.students.map(s => { const le = (s.lessons || [])[0];
    return `<div class="crow"><button class="crowm" data-act="clsst" data-s="${esc(s.sid)}"><span class="cav">${esc(s.name.slice(0, 1).toUpperCase())}</span><span class="lt"><b>${esc(s.name)}</b><small>We stopped at ${esc(clsName(s.stop))}${le ? " · " + esc(clsDay(le.d)) : ""}</small></span></button>
      <button class="btn small" data-act="clsbegin" data-s="${esc(s.sid)}">Start the lesson ▶</button></div>`; }).join("");
  app.innerHTML = `<header class="hero">${topline(true)}<div class="hin" style="display:block"><h2 class="cht2">My students</h2><p class="say">Every student has their own place in the book. Start the lesson and Capiva opens right where you stopped.</p></div></header>
  <main class="chap">${CT.msg ? `<p class="tmsgok">${esc(CT.msg)}</p>` : ""}
  <section class="step"><h3 class="sech">Students</h3><div class="clist">${rows || `<p class="tmuted">No students yet.</p>`}</div>
    <div class="cform" style="margin-top:12px"><input id="cnew" placeholder="Student's name" maxlength="40"><button class="btn" data-act="clsadd">Add a student</button></div></section>
  <section class="step"><h3 class="sech">Your name</h3><div class="cform"><input id="ctname" value="${esc(d.name)}" placeholder="Teacher's name" maxlength="40"><button class="btn ghost small" data-act="clssavename">Save</button></div></section>
  <section class="step"><h3 class="sech">How it works</h3><ol class="tlist">
    <li><b>Start the lesson:</b> Capiva opens as that student's book, at the place where you stopped last time. What you play together counts for the student.</li>
    <li><b>End the lesson:</b> Capiva writes the date and where you stopped in the student's diary.</li>
    <li><b>The student's app:</b> the student scans the QR code with the phone or tablet where they practise. Their app shows where you stopped and continues from there.</li></ol>
    <p class="tmuted">Everything stays on the devices: there is no account and no server.</p>
    <details class="more"><summary>Address of the app for the QR codes</summary><p class="tmuted">The QR codes open Capiva at this address.${file ? " You opened Capiva from a file: the new version of Capiva must be online at this address." : ""}</p>
      <div class="cform"><input id="curl" value="${esc(d.url)}" placeholder="${esc(clsDefaultBase())}"><button class="btn ghost small" data-act="clsurl">Save</button></div></details></section>
  <div class="pb"><button class="btn ghost" data-act="bkteacher">◀ For teachers</button></div></main>`;
  CT.msg = ""; window.scrollTo(0, 0);
}
function clsStudent(sid) {
  Voice.stop(); screen = "clsst"; L = null;
  const d = TS.load(), s = d.students.find(x => x.sid === sid); if (!s) return clsTeacher();
  const diary = (s.lessons || []).map(e => `<li><b>${esc(clsDay(e.d))}</b><span>We stopped at ${esc(clsName(e.s))}</span>${e.note ? `<i>${esc(e.note)}</i>` : ""}<button class="linkbtn" data-act="clsdel" data-s="${esc(sid)}" data-e="${esc(e.id)}">${CT.del === e.id ? "delete?" : "delete"}</button></li>`).join("");
  app.innerHTML = `<header class="hero">${topline(true)}<div class="hin" style="display:block"><p class="chkick">My students</p><h2 class="cht2">${esc(s.name)}</h2></div></header>
  <main class="chap">${CT.msg ? `<p class="tmsgok">${esc(CT.msg)}</p>` : ""}
  <section class="step cstopbox"><div><h3 class="sech">We stopped at</h3><p class="cstop">${esc(clsName(s.stop))}</p></div><div class="cbtns2"><button class="btn" data-act="clsbegin" data-s="${esc(sid)}">Start the lesson ▶</button><button class="btn ghost small" data-act="clschange" data-s="${esc(sid)}">Change</button></div></section>
  ${CF && CF.sid === sid && !CF.end ? `<section class="step">${clsFormHtml()}</section>` : ""}
  <section class="step"><h3 class="sech">Lesson diary</h3>${diary ? `<ul class="cdlist">${diary}</ul>` : `<p class="tmuted">After every lesson Capiva writes the date and where you stopped.</p>`}</section>
  <section class="step cconn"><div><h3 class="sech">${esc(s.name)}'s QR code</h3><p class="tmuted">${esc(s.name)} scans it with the device where they practise: the app shows where you stopped and continues from there. Show it again after a lesson to update it.</p></div><div class="qrbox">${QR.svg(clsLinkOf(d, s), 170, "M")}</div></section>
  <div class="pb"><button class="btn ghost" data-act="clsteacher">◀ My students</button><button class="btn ghost small" data-act="clsrm" data-s="${esc(sid)}">${CT.rm === sid ? "Remove for good?" : "Remove student"}</button></div></main>`;
  CT.msg = "";
}
const clsLinkOf = (d, s) => clsLink({ k: "hi", v: 2, sid: s.sid, n: s.name, t: d.name || "your teacher", s: s.stop || null, d: ((s.lessons || [])[0] || {}).d || null });
// choose where we stopped: chapter, then lesson
function clsFormHtml() {
  const ch = BOOK.CH[CF.ch - 1];
  return `<div class="cformbox"><div class="cgrid">${CF.end ? `<label>Date<input type="date" id="cfd" value="${esc(CF.d)}"></label>` : ""}
    <label>Chapter<select id="cfch">${BOOK.CH.map(c => `<option value="${c.n}"${c.n === CF.ch ? " selected" : ""}>Chapter ${c.n} · ${esc(c.t)}</option>`).join("")}</select></label>
    <label>We stopped at<select id="cfs">${ch.lessons.map(l => `<option value="${l.id}"${l.id === CF.s ? " selected" : ""}>${esc(bkTitle(l))}</option>`).join("")}</select></label></div>
    ${CF.end ? `<label class="cfull">Notes for me (optional)<textarea id="cfn" rows="2" maxlength="400" placeholder="e.g. Right-hand wrist still too high.">${esc(CF.note)}</textarea></label>` : ""}
    <div class="pb">${CF.end ? "" : `<button class="btn ghost" data-act="clscancel">Cancel</button>`}<button class="btn" data-act="clssave">${CF.end ? "Save and end the lesson" : "Save"}</button></div></div>`;
}
function clsFormRead() { if (!CF) return; const v = id => (document.getElementById(id) || {}).value; CF.d = v("cfd") || CF.d; CF.s = v("cfs") || CF.s; CF.note = (v("cfn") || "").trim(); }
function clsEndScreen() {
  Voice.stop(); screen = "clsend"; L = null;
  const d = TS.load(), s = d.students.find(x => x.sid === d.active); if (!s) { d.active = null; TS.save(d); return clsTeacher(); }
  if (!CF || !CF.end) { const stop = clsStopNow(), l = bkFind(stop); CF = { sid: s.sid, end: true, d: clsToday(), ch: l.chap.n, s: stop, note: "" }; }
  app.innerHTML = `<header class="hero">${topline(true)}<div class="hin" style="display:block"><p class="chkick">Lesson with ${esc(s.name)}</p><h2 class="cht2">End of the lesson</h2><p class="say">Where did you stop today? Capiva suggests the lesson you were playing.</p></div></header>
  <main class="chap"><section class="step">${clsFormHtml()}</section><div class="pb"><button class="btn ghost" data-act="bkhome">◀ Go on with the lesson</button></div></main>`;
  window.scrollTo(0, 0);
}
function clsBegin(sid) {
  const d = TS.load(), s = d.students.find(x => x.sid === sid); if (!s) return;
  if (d.active && d.active !== sid) { const o = d.students.find(x => x.sid === d.active); if (o) o.book = clsCopy(P.book); }
  if (!d.active) d.own = clsCopy(P.book);
  d.active = sid; P.book = s.book ? clsCopy(s.book) : clsSetStop(clsFresh(), s.stop || BK_LESSONS[0].id);
  ["done", "skip", "quiz", "mile"].forEach(k => { P.book[k] = P.book[k] || {}; }); P.book.about = true;
  TS.save(d); saveP(); CF = null;
  const l = bkFind(s.stop) || BK_LESSONS[Math.max(0, bkNextIdx())];
  bkStart(l); window.scrollTo(0, 0);
}
function clsFinish() {   // back to the teacher's own book
  const d = TS.load(), s = d.students.find(x => x.sid === d.active);
  if (s) s.book = clsCopy(P.book);
  P.book = d.own ? d.own : clsFresh(); d.own = null; d.active = null; TS.save(d); saveP();
  return s;
}
document.addEventListener("change", e => {
  if (!CF || (screen !== "clsst" && screen !== "clsend")) return;
  if (e.target.id === "cfch") { clsFormRead(); CF.ch = +e.target.value; CF.s = BOOK.CH[CF.ch - 1].lessons[0].id; CF.end ? clsEndScreen() : clsStudent(CF.sid); }
});
function clsQr(sid) {
  const d = TS.load(), s = d.students.find(x => x.sid === sid); if (!s) return;
  const link = clsLinkOf(d, s);
  modal(`<h2>${esc(s.name)}'s QR code</h2><p>${esc(s.name)} scans it with the device where they practise. The app shows where you stopped, <b>${esc(clsName(s.stop))}</b>, and continues from there.</p>
    <div class="qrbox">${QR.svg(link, 240, "M")}</div><input class="linkin" readonly value="${esc(link)}">
    <div class="pb" style="margin-top:14px">${navigator.share ? `<button class="btn" data-act="sharelink" data-l="${esc(link)}">Share</button>` : ""}<button class="btn ghost" data-act="copylink" data-l="${esc(link)}">Copy link</button><button class="btn ghost" data-act="closemodal">Close</button></div>`);
}

Object.assign(ACT, {
  clsteacher: () => { CF = null; CT = { msg: "" }; clsTeacher(); },
  clssavename: () => { const d = TS.load(); d.name = (document.getElementById("ctname").value || "").trim(); TS.save(d); P.mark = Object.assign(P.mark || {}, { teacher: d.name }); saveP(); CT.msg = "Saved."; clsTeacher(); },
  clsurl: () => { const d = TS.load(); d.url = (document.getElementById("curl").value || "").trim(); TS.save(d); CT.msg = "Saved."; clsTeacher(); },
  clsadd: () => { const n = (document.getElementById("cnew").value || "").trim(); if (!n) return document.getElementById("cnew").focus(); const d = TS.load(), sid = clsSid();
    d.students.push({ sid, name: n, created: Date.now(), stop: BK_LESSONS[0].id, lessons: [] }); TS.save(d); CT.msg = `${n} starts at the beginning of the book. If ${n} already knows some chapters, press “Change”.`; clsStudent(sid); },
  clsst: b => { CF = null; CT.del = CT.rm = null; clsStudent(b.dataset.s); window.scrollTo(0, 0); },
  clsbegin: b => clsBegin(b.dataset.s),
  clsend: () => { CF = null; clsEndScreen(); },
  clschange: b => { const d = TS.load(), s = d.students.find(x => x.sid === b.dataset.s), l = bkFind(s.stop) || BK_LESSONS[0]; CF = { sid: s.sid, end: false, ch: l.chap.n, s: l.id }; clsStudent(s.sid); },
  clscancel: () => { const sid = CF && CF.sid; CF = null; clsStudent(sid); },
  clssave: () => {
    clsFormRead(); const f = CF; CF = null;
    if (f.end) {
      const s0 = clsFinish(); if (!s0) return clsTeacher();
      const d = TS.load(), s = d.students.find(x => x.sid === s0.sid);
      s.stop = f.s; s.book = clsSetStop(s.book || clsFresh(), f.s);
      s.lessons = [{ id: "l" + Date.now().toString(36), d: f.d, s: f.s, note: f.note }].concat(s.lessons || []).sort((a, b) => b.d.localeCompare(a.d)).slice(0, 200);
      TS.save(d); CT.msg = `Saved in ${s.name}'s diary. ${s.name} can scan the QR code to update the app at home.`; clsStudent(s.sid); clsQr(s.sid);
    } else {
      const d = TS.load(), s = d.students.find(x => x.sid === f.sid); s.stop = f.s; if (s.book) clsSetStop(s.book, f.s); TS.save(d); CT.msg = "Saved."; clsStudent(s.sid);
    }
  },
  clsdel: b => { if (CT.del !== b.dataset.e) { CT.del = b.dataset.e; return clsStudent(b.dataset.s); } const d = TS.load(), s = d.students.find(x => x.sid === b.dataset.s); s.lessons = s.lessons.filter(x => x.id !== b.dataset.e); TS.save(d); CT.del = null; clsStudent(b.dataset.s); },
  clsrm: b => { if (CT.rm !== b.dataset.s) { CT.rm = b.dataset.s; return clsStudent(b.dataset.s); } const d = TS.load(); d.students = d.students.filter(x => x.sid !== b.dataset.s); TS.save(d); CT.rm = null; clsTeacher(); },
  clsaccept: () => clsAccept()
});
Object.assign(window.CapyJam.book, { cls: { TS, teacher: clsTeacher, student: clsStudent, link: clsLink, linkIn: clsLinkIn, end: clsEndScreen } });

boot();

}
</script>
</body>
</html>
