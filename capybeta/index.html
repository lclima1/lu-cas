<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capiva · beta</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE a friendly game for guitar learners: warm, playful, clear
   IDEA a capybara's riverbank: the map runs through meadow, sunset and night river; Capy talks you through every step
   PICTURE Capy with an orange on its head and a guitar by the river; in lessons the rosewood neck with the shape box
   COLOUR sky blue band, meadow green / sunset orange / night river worlds, yuzu orange buttons, green right, red wrong
   TYPE Fredoka for titles and buttons, Nunito for text
   LAYOUT hero = text + speech bubble left, scene card right; worlds as full-width bands with a zigzag path; phone stacks title, scene, bubble */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f140f);--ink:light-dark(#1f1b14,#f2eee5);
--line:light-dark(#e6e0d4,#2a3229);--card:light-dark(#ffffff,#172016);
--yuzu:#ff8a12;--yuzuD:#c25d00;--ok:#21a058;--okD:#167540;--bad:#e5484d;--box:#f2c14e;
--hero:light-dark(#d6efff,#0c1d2c);--sky1:light-dark(#bfe6ff,#0b1b2b);--sky2:light-dark(#fff3d4,#1d3a52);--sun:light-dark(#ffd35c,#f1eedb);
--hill:light-dark(#a3d68d,#22442f);--river:light-dark(#3aa6d4,#185070);--grass:light-dark(#6dbf56,#2a5a2e);--grass2:light-dark(#4f9e3f,#1f4423);
--w1:light-dark(#eef8e7,#122014);--w2:light-dark(#fff0dc,#24190d);--w3:light-dark(#e3f2f5,#0d1f25);
--a1:#3f9a4a;--a2:#e8731a;--a3:#1f7f96}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root{--soft:light-dark(#5f584c,#b6afa1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2b7de9;outline-offset:2px}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 22px;font:600 17px Fredoka,Nunito,sans-serif;background:var(--yuzu);color:#fff;box-shadow:0 4px 0 var(--yuzuD);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--yuzuD)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{min-height:40px;font-size:15px;padding:0 14px}
/* hero */
.hero{background:var(--hero);padding:18px max(4vw,16px) 26px}
.hin{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px 34px;align-items:center}
.topline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1120px;margin:0 auto 10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(38px,5vw,52px);font-weight:700}
.brand h1 b{color:var(--yuzu);font-weight:700}
.brand p{margin:0;color:var(--soft);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;white-space:nowrap}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.bubble p{margin:0}
.bubble .say{color:var(--soft);margin-top:6px;font-size:15px}
.bubble h3{font-size:22px;margin-bottom:4px}
.bubble.r::after{content:"";position:absolute;right:-12px;top:42%;width:20px;height:20px;background:var(--card);border-right:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.bubble.l::after{content:"";position:absolute;left:-12px;top:22px;width:20px;height:20px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .bb{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.scene{position:relative;border-radius:24px;overflow:hidden;height:300px;box-shadow:0 2px 0 var(--line)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
/* map */
.weak{max-width:820px;margin:22px auto 0;padding:0 16px}
.weak .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.weak h3{font-size:19px}
.weak p{margin:4px 0 0;color:var(--soft);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap;font-weight:700}
.tags b{color:var(--bad)}
.world{padding:30px max(4vw,16px) 40px;margin-top:26px}
.world.w0{background:var(--w1)}.world.w1{background:var(--w2)}.world.w2{background:var(--w3)}
.win{max-width:820px;margin:0 auto}
.whead{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:center}
.whead h2{font-size:clamp(26px,3.4vw,34px)}
.whead p{margin:8px 0 0;color:var(--soft)}
.lvl{display:inline-block;margin-bottom:8px;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;color:#fff}
.w0 .lvl{background:var(--a1)}.w1 .lvl{background:var(--a2)}.w2 .lvl{background:var(--a3)}
.mini{width:230px;height:70px}
.unit{margin-top:28px}
.uhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.uhead h3{font-size:23px}
.unit>p{margin:4px 0 0;color:var(--soft);font-size:15px;max-width:640px}
.jump{display:inline-flex;align-items:center;gap:6px;min-height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 12px;font:600 15px Fredoka,Nunito,sans-serif;white-space:nowrap}
.jump svg{width:18px;height:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:2px}
.node button{width:70px;height:70px;border-radius:50%;border:0;background:var(--yuzu);color:#fff;font:700 25px Fredoka,sans-serif;box-shadow:0 6px 0 var(--yuzuD);display:grid;place-items:center}
.node button:active{transform:translateY(3px);box-shadow:0 3px 0 var(--yuzuD)}
.node.done button{background:var(--ok);box-shadow:0 6px 0 var(--okD)}
.node.locked button{background:var(--line);color:var(--soft);box-shadow:0 6px 0 color-mix(in srgb,var(--line),#000 18%);cursor:not-allowed}
.node.next button{outline:6px solid color-mix(in srgb,var(--yuzu) 30%,transparent);outline-offset:5px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:10px}}
.stars{color:#e9a400;font-size:15px;letter-spacing:2px;min-height:21px;margin-top:6px}
.node small{color:var(--soft);font-size:13px;font-weight:700;white-space:nowrap}
.note{text-align:center;color:var(--soft);font-size:13px;padding:24px 16px 40px}
/* start screen */
.start{max-width:1120px;margin:0 auto;padding:10px max(4vw,16px) 50px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.langs button{min-height:42px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-weight:800}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.scard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.scard h3{font-size:22px}
.scard p{margin:0;color:var(--soft);font-size:15px;flex:1}
.scard .mini{width:100%;height:auto}
.scard.w0{border-top:8px solid var(--a1)}.scard.w1{border-top:8px solid var(--a2)}.scard.w2{border-top:8px solid var(--a3)}
/* lesson */
.lbar{display:flex;align-items:center;gap:14px;max-width:980px;margin:0 auto;padding:14px 16px}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--soft);font-size:32px;line-height:1}
.prog{flex:1;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.lx{font:700 18px Fredoka,sans-serif;white-space:nowrap}
.hearts{color:var(--bad);font-size:22px;letter-spacing:2px;white-space:nowrap}
.lesson{max-width:980px;margin:0 auto;padding:0 16px 150px}
.capyrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:end;margin:4px 0 16px}
.capyrow svg{width:96px;height:72px}
.capyrow .bubble{margin-left:8px}
.capyrow .bubble #say{font-weight:800;font-size:18px;min-height:2.9em}
.capyrow .kick{color:var(--soft);font-size:13px;font-weight:700;margin:0 0 4px}
.capyrow .bubble .say{font-size:15px;margin-top:4px}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 26px;align-items:start;margin:6px 0 12px}
.play{width:120px;height:120px;border-radius:30px;border:0;background:var(--yuzu);color:#fff;box-shadow:0 6px 0 var(--yuzuD);display:grid;place-items:center;align-content:center;gap:4px;font:600 17px Fredoka,sans-serif}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 var(--yuzuD)}
.play svg{width:44px;height:44px}
.chords{display:flex;gap:4px;margin-bottom:10px;max-width:560px}
.chords span{border-radius:10px;background:color-mix(in srgb,var(--a3) 16%,var(--card));border:2px solid color-mix(in srgb,var(--a3) 40%,transparent);padding:4px 10px;font:600 17px Fredoka,sans-serif;white-space:nowrap}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px}
.slot{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:600 15px Fredoka,sans-serif;background:var(--card)}
.slot.sm{font-size:12px}
.slot.cur{border-color:var(--yuzu)}
.slot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.slot.rev{background:var(--box);border-color:var(--box);color:#3a2018}
.slot.bad{animation:shake .35s}
.arrow{color:var(--soft);font:700 18px Fredoka,sans-serif;width:12px;text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hint{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 13px;font-weight:800;white-space:nowrap}
.hint small{color:var(--soft);font-weight:600;margin-left:6px}
.hint.used{border-color:var(--box);background:color-mix(in srgb,var(--box) 22%,var(--card))}
.hint.rv{color:var(--soft);border-style:dashed}
.neck{position:relative;height:214px;margin:12px 0 6px;user-select:none}
.neck svg{position:absolute;inset:0;width:100%;height:100%}
.neck rect[data-act]{cursor:pointer}
.fn{fill:var(--soft);font:600 13px Nunito,sans-serif;text-anchor:middle}
.nl{fill:var(--ink);font:600 14px Fredoka,sans-serif}
.ml{fill:#fff;font:700 12px Fredoka,sans-serif;text-anchor:middle}
.meter{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--soft);font-size:15px}
.meter b{color:var(--ink);font:600 19px Fredoka,sans-serif;min-width:52px}
.lvlm{display:inline-block;width:130px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.lvlm i{display:block;height:100%;width:0;background:var(--ok)}
.panel{position:fixed;left:0;right:0;bottom:0;padding:16px max(4vw,16px) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--bg);border-top:2px solid var(--line);z-index:5}
.panel.ok{background:light-dark(#e0f5e8,#0f2e1c);border-color:transparent}
.panel.ok h3{color:var(--ok);font-size:26px}
.panel.rev{background:light-dark(#fff2da,#33250e);border-color:transparent}
.panel.rev h3{font-size:24px}
.panel p{margin:4px 0 0;color:var(--soft)}
.pb{display:flex;gap:10px;flex-wrap:wrap}
/* result */
.res{max-width:640px;margin:0 auto;padding:40px 16px 60px;text-align:center}
.res .capybig{width:220px;height:165px}
.res h1{font-size:clamp(32px,6vw,46px);margin-top:6px}
.res .bubble{text-align:left;margin:16px auto 0;max-width:520px}
.bigstars{font-size:56px;color:#e9a400;letter-spacing:8px;margin:12px 0}
.bigstars span{color:var(--line)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 26px}
.figs div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.figs b{display:block;font:600 30px Fredoka,sans-serif}
.figs span{color:var(--soft);font-size:14px;font-weight:700}
.res .pb{justify-content:center}
/* tuner + modal */
.tuner{max-width:640px;margin:0 auto;padding:30px 16px 60px;text-align:center}
.tuner .sub{color:var(--soft)}
.big{font:600 clamp(72px,18vw,128px)/1 Fredoka,sans-serif;margin:20px 0 6px}
.needle{position:relative;height:42px;max-width:440px;margin:14px auto;border-radius:12px;background:var(--card);border:2px solid var(--line)}
.needle b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ok)}
.needle i{position:absolute;top:5px;bottom:5px;width:8px;margin-left:-4px;border-radius:4px;background:var(--yuzu);left:50%;transition:left .08s}
.meter.c{justify-content:center;margin:10px 0 24px}
.modal{position:fixed;inset:0;background:rgba(15,12,8,.55);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--bg);border-radius:22px;max-width:560px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.sheet h2{font-size:28px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row label{flex:1;font-weight:700}
.row small{display:block;color:var(--soft);font-size:13px;font-weight:600}
input[type=range]{width:150px;accent-color:var(--yuzu)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--yuzu)}
select{font:16px Nunito,sans-serif;min-height:42px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px}
@media (max-width:860px){.cards{grid-template-columns:minmax(0,1fr)}.scard .mini{max-width:320px}}
@media (max-width:720px){
.hin{grid-template-columns:minmax(0,1fr)}
.hin .scene{order:-1;height:230px}
.bubble.r::after{right:auto;left:40px;top:-12px;transform:rotate(-45deg)}
.whead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
.stage{grid-template-columns:minmax(0,1fr)}
.play{width:100%;height:68px;border-radius:18px;grid-auto-flow:column;justify-content:center;gap:10px}
.play svg{width:30px;height:30px}
.capyrow{grid-template-columns:72px minmax(0,1fr)}
.capyrow svg{width:72px;height:54px}
.capyrow .bubble #say{font-size:16px;min-height:4.4em}
.slot{width:40px;height:40px}
.panel .pb{width:100%}
.panel .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* intro + onboarding */
.intro{max-width:1120px;margin:0 auto;padding:6px max(4vw,16px) 40px}
.igrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px 34px;align-items:center}
.igrid .scene{height:340px}
.ibub h2{font-size:clamp(28px,4vw,40px);margin-bottom:10px}
.ibub p{margin:0;font-size:18px;line-height:1.55}
.dots{display:flex;gap:8px;margin:18px 0 0;align-items:center}
.dots i{width:10px;height:10px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--yuzu);width:26px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.ibtn{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 18px;min-height:120px}
.ibtn svg{width:92px;height:92px}
.ibtn b{display:block;font:600 22px Fredoka,sans-serif}
.ibtn span{color:var(--soft);font-weight:700}
.ibtn[aria-pressed=true]{border-color:var(--yuzu);box-shadow:0 0 0 4px color-mix(in srgb,var(--yuzu) 25%,transparent)}
.okline{margin:14px 0 0;font-weight:800;color:var(--okD)}
.setup h2.q{font-size:clamp(24px,3.2vw,30px);margin-top:30px}
/* tuner */
.tgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-areas:'b t' 'h t';grid-template-rows:auto 1fr;gap:22px 30px;align-items:start;max-width:1120px;margin:0 auto;padding:10px max(4vw,16px) 50px}
.tgrid .tb{grid-area:b}.tgrid .tcard{grid-area:t}.tgrid .howto{grid-area:h}
.howto{margin:0;padding-left:22px;display:grid;gap:8px;color:var(--ink)}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.strs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sch{min-width:56px;border-radius:12px;border:2px solid var(--line);padding:4px 8px;font:600 16px Fredoka,sans-serif;background:var(--card)}
.sch small{display:block;color:var(--soft);font:700 11px Nunito,sans-serif}
.sch.cur{border-color:var(--yuzu);box-shadow:0 0 0 3px color-mix(in srgb,var(--yuzu) 25%,transparent)}
.sch.done{background:var(--ok);border-color:var(--ok);color:#fff}.sch.done small{color:#e7fbe9}
.tbig{font:600 clamp(54px,10vw,84px)/1 Fredoka,sans-serif;margin:14px 0 2px}
.tsub{color:var(--soft);font-weight:700;margin:0}
.tmsg{font:600 20px Fredoka,sans-serif;min-height:1.5em;margin:4px 0}
.tmsg.far{font-size:16px}.tmsg.ok{color:var(--ok)}.tmsg.lo,.tmsg.hi{color:var(--yuzuD)}
.tneck{position:relative;height:180px;margin:8px 0}
.tneck svg{position:absolute;inset:0;width:100%;height:100%}
.tbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tdone{margin-top:14px}
/* how it works */
.steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.steps li b{width:34px;height:34px;border-radius:50%;background:var(--yuzu);color:#fff;display:grid;place-items:center;font:600 18px Fredoka,sans-serif}
.steps li.rd b{background:var(--a3)}
/* track tabs */
.tabs{display:flex;gap:6px;max-width:820px;margin:22px auto 0;padding:5px;border-radius:16px;background:var(--line)}
.tabs button{flex:1;min-height:46px;border:0;border-radius:12px;background:transparent;font:600 17px Fredoka,sans-serif;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 color-mix(in srgb,var(--line),#000 15%)}
.world.rd{background:var(--w3)}
.rd .lvl{background:var(--a3)}
/* staff + cards */
.staffw{overflow-x:auto;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 6px;margin-bottom:4px}
.staffw svg{display:block}
.cvis{display:grid;gap:12px;margin:8px 0 12px}
.cneck{position:relative;height:200px}
.cneck svg{position:absolute;inset:0;width:100%;height:100%}
.cbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sl{fill:var(--soft);font:700 12px Nunito,sans-serif;text-anchor:middle}
/* reveal */
.res h2.song{font-size:clamp(26px,4.4vw,36px);margin-top:6px;color:var(--yuzuD)}
.origin{display:inline-block;margin-top:10px;border-radius:999px;background:var(--card);border:2px solid var(--line);padding:4px 14px;font-weight:800}

<div id="app"></div>
<script id="core">
var CJ = (function () {
  const LANGS = ["en", "de", "it", "fr", "pt"];
  const OPEN = [0, 64, 59, 55, 50, 45, 40];   // sounding MIDI pitch of open strings 1..6
  const NAMES = {
    en: ["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"],
    de: ["C","Cis","D","Es","E","F","Fis","G","Gis","A","B","H"],
    it: ["Do","Do♯","Re","Mi♭","Mi","Fa","Fa♯","Sol","Sol♯","La","Si♭","Si"],
    fr: ["Do","Do♯","Ré","Mi♭","Mi","Fa","Fa♯","Sol","Sol♯","La","Si♭","Si"],
    pt: ["Dó","Dó♯","Ré","Mi♭","Mi","Fá","Fá♯","Sol","Sol♯","Lá","Si♭","Si"] };
  const pc = m => ((m % 12) + 12) % 12;
  const noteName = (m, lang) => NAMES[lang || "en"][pc(m)];

  /* ---------- fretboard geometry ---------- */
  function posIn(m, win) {
    let b = null;
    for (let s = 1; s <= 6; s++) { const f = m - OPEN[s]; if (f < win[0] || f > win[1]) continue; if (!b || f < b.f) b = { s, f }; }
    return b;
  }
  function nearestPos(m, win) {
    const c = (win[0] + win[1]) / 2; let b = null;
    for (let s = 1; s <= 6; s++) { const f = m - OPEN[s]; if (f < 0 || f > 15) continue; const d = Math.abs(f - c); if (!b || d < b.d) b = { s, f, d }; }
    return b;
  }
  function pos(m, P) { return posIn(m, P.win) || (P.ext && posIn(m, P.ext)) || nearestPos(m, P.win); }
  function poolFor(win, pcs, strings) {
    const set = new Set();
    for (let s = 1; s <= 6; s++) { if (strings && !strings.includes(s)) continue; for (let f = win[0]; f <= win[1]; f++) { const m = OPEN[s] + f; if (pcs.includes(pc(m))) set.add(m); } }
    return [...set].sort((a, b) => a - b);
  }
  // positions on the neck. name: [en, de, it, fr, pt]
  const POS = {
    p1: { win: [0, 3], name: ["Open position", "1. Lage", "Prima posizione", "Première position", "Primeira posição"] },
    s1: { win: [5, 8], name: ["Shape 1", "Shape 1", "Shape 1", "Shape 1", "Shape 1"] },
    s2: { win: [7, 10], name: ["Shape 2", "Shape 2", "Shape 2", "Shape 2", "Shape 2"] },
    s12: { win: [5, 10], name: ["Shapes 1 + 2", "Shapes 1 + 2", "Shape 1 + 2", "Shapes 1 + 2", "Shapes 1 + 2"] },
    s3: { win: [9, 13], name: ["Shape 3", "Shape 3", "Shape 3", "Shape 3", "Shape 3"] },
    s4: { win: [0, 3], name: ["Shape 4", "Shape 4", "Shape 4", "Shape 4", "Shape 4"] },
    s5: { win: [2, 5], name: ["Shape 5", "Shape 5", "Shape 5", "Shape 5", "Shape 5"] },
    j7: { win: [7, 10], ext: [6, 11], name: ["7th position", "7. Lage", "Settima posizione", "7e position", "7ª posição"] },
    m5: { win: [4, 8], ext: [3, 9], name: ["5th position", "5. Lage", "Quinta posizione", "5e position", "5ª posição"] }
  };

  /* ---------- pitch detection ---------- */
  function mpm(x, sr, minF, maxF) {   // McLeod pitch method
    const N = x.length, maxTau = Math.min(N - 2, Math.floor(sr / minF)), minTau = Math.max(2, Math.floor(sr / maxF));
    const nsdf = new Float32Array(maxTau + 2);
    let m = 0; for (let i = 0; i < N; i++) m += 2 * x[i] * x[i];
    for (let tau = 0; tau <= maxTau + 1; tau++) {
      if (tau > 0) m -= x[tau - 1] * x[tau - 1] + x[N - tau] * x[N - tau];
      let r = 0; const lim = N - tau;
      for (let j = 0; j < lim; j++) r += x[j] * x[j + tau];
      nsdf[tau] = m > 1e-12 ? 2 * r / m : 0;
    }
    let tau = 1; while (tau <= maxTau && nsdf[tau] > 0) tau++;
    const peaks = []; let inPos = false, bi = -1, bv = -1;
    for (; tau <= maxTau; tau++) {
      if (nsdf[tau] > 0) { inPos = true; if (tau >= minTau && nsdf[tau] > bv) { bv = nsdf[tau]; bi = tau; } }
      else if (inPos) { if (bi > 0) peaks.push(bi); inPos = false; bi = -1; bv = -1; }
    }
    if (inPos && bi > 0) peaks.push(bi);
    if (!peaks.length) return null;
    let top = 0; for (const p of peaks) top = Math.max(top, nsdf[p]);
    const k = peaks.find(p => nsdf[p] >= 0.9 * top);

  function analyzeFrame(buf, sr) {
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / buf.length);

  }
  class NoteTracker {   // frames -> note events; re-attacks of the same note count as new notes
    constructor(stable) { this.stable = stable || 3; this.onsets = 0; this.reset(); }
    reset() { this.last = null; this.cand = null; this.count = 0; this.armed = true; this.hist = []; this.quiet = 0; this.since = 99; this.fh = []; }
    push(fr) {
      const h = this.hist, prevMin = h.length ? Math.min.apply(null, h.slice(-6)) : 0;
      h.push(fr.rms); if (h.length > 10) h.shift();
      this.since++;
      const hot = h.length > 2 && fr.rms > fr.gate * 1.5 && fr.rms > prevMin * 1.6;
      if (hot) { this.armed = true; this.count = 0; }
      // onsets: a jump in loudness, or new partials appearing (spectral flux) while other strings ring
      let fhot = false;
      if (fr.flux != null) {
        const fh = this.fh, med = fh.length > 5 ? fh.slice().sort((a, b) => a - b)[fh.length >> 1] : 1;
        fhot = fr.rms > fr.gate && fr.flux > .22 && fr.flux > 3 * med;
        fh.push(fr.flux); if (fh.length > 24) fh.shift();
      }
      const on = hot || fhot;
      if (on && !this.hot && this.since > 3) { this.onsets++; this.since = 0; }   // one onset per attack (rising edge)
      this.hot = on;
      if (fr.rms < fr.gate) { this.quiet++; if (this.quiet > 5) { this.last = null; this.armed = true; } this.count = 0; return null; }
      this.quiet = 0;
      if (fr.midi == null || fr.clarity < 0.8) { this.count = 0; return null; }

      if (this.count < this.stable) return null;
      if (n === this.last && !this.armed) return null;
      if (this.last != null && !this.armed && [12, 19, 24].includes(Math.abs(n - this.last))) return null;

  /* ---------- harmony ---------- */
  const CMAJ = [0, 2, 4, 5, 7, 9, 11], APENTA = [9, 0, 2, 4, 7], ABLUES = [9, 0, 2, 3, 4, 7], AHARM = [9, 11, 0, 2, 4, 5, 8];

    C: { tones: [0, 4, 7], v: [48, 52, 55, 60] },
    Dm: { tones: [2, 5, 9], v: [50, 53, 57, 62] },
    G: { tones: [7, 11, 2], v: [43, 50, 55, 59] },
    Cmaj7: { tones: [0, 4, 7, 11], guide: [4, 11], v: [36, 52, 55, 59] },
    Dm7: { tones: [2, 5, 9, 0], guide: [5, 0], v: [38, 53, 57, 60] },
    G7: { tones: [7, 11, 2, 5], guide: [11, 5], v: [43, 53, 59, 62] },
    Bm7b5: { tones: [11, 2, 5, 9], guide: [2, 9], v: [47, 50, 53, 57] },
    E7: { tones: [4, 8, 11, 2], guide: [8, 2], v: [40, 50, 56, 59] },
    Am7: { tones: [9, 0, 4, 7], guide: [0, 7], v: [45, 52, 55, 60] }

  /* ---------- generators: the "grammar" ---------- */
  function rhythmFor(L, mode, rnd) {
    if (mode !== "mixed") { const d = new Array(L).fill(1); d[L - 1] = 2; return d; }
    const d = []; let left = L - 1;
    while (left > 0) {
      const r = rnd();
      if (left >= 2 && r < 0.35) { d.push(0.5, 0.5); left -= 2; }
      else if (left >= 2 && r < 0.55) { d.push(1.5, 0.5); left -= 2; }
      else { d.push(1); left -= 1; }
    }
    d.push(2); return d;
  }
  function pick(opts, rnd) { let tot = 0; for (const o of opts) tot += o[1]; let r = rnd() * tot; for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; } return opts[opts.length - 1][0]; }

  // random walk on a pool of notes (scales, shapes, arpeggios)
  function genWalk(p, rnd, weak) {
    const pool = p.pool, L = p.len[0] + Math.floor(rnd() * (p.len[1] - p.len[0] + 1));
    const startIdx = pool.map((m, i) => [m, i]).filter(x => pc(x[0]) === p.tonicPc).map(x => x[1]);
    for (let a = 0; a < 400; a++) {
      let idx = p.start === "tonic" && startIdx.length ? startIdx[Math.floor(rnd() * startIdx.length)] : Math.floor(rnd() * pool.length);
      const seq = [idx];
      while (seq.length < L) {
        const opts = [];
        for (let d = -p.leap; d <= p.leap; d++) {
          if (d === 0 && !p.repeat) continue;
          const j = idx + d; if (j < 0 || j >= pool.length) continue;
          let w = d === 0 ? 0.7 : Math.abs(d) === 1 ? 4 : Math.abs(d) === 2 ? 2 : 1;
          const iv = pool[j] - pool[idx]; if (weak && weak[iv]) w *= 1 + 3 * weak[iv];
          opts.push([j, w]);
        }
        idx = pick(opts, rnd); seq.push(idx);
      }
      const notes = seq.map(i => pool[i]), last = pc(notes[notes.length - 1]);
      if (p.end === "tonic" && last !== p.tonicPc) continue;
      if (p.end === "chord" && !p.chordPcs.includes(last)) continue;
      if (Math.max.apply(null, notes) - Math.min.apply(null, notes) > (p.span || 12)) continue;
      return { notes, durs: rhythmFor(L, p.rhythm, rnd) };
    }
    return null;
  }

      story: "“Over the Waves” was composed by Juventino Rosas (1868–1894), an Otomi (Indigenous Mexican) violinist. The waltz became famous all over the world, and many people thought it was by Johann Strauss or simply “traditional”. His home town is now called Santa Cruz de Juventino Rosas. The curved lines are ties: hold the note." },

  const NOTE_CH = { 55: 1, 56: 2, 57: 2, 59: 3, 60: 3, 62: 3, 64: 4, 65: 4, 67: 4, 50: 6, 52: 6, 53: 6, 45: 7, 47: 7, 48: 7, 40: 8, 41: 8, 43: 8 };
  function levelOf(p) {
    if (p.lvl) return p.lvl;
    const V = BKC.voicesOf(p), meter = p.meter || [4, 4];
    let lv = 1;
    const up = x => { if (x > lv) lv = x; };
    if (meter[0] === 3) up(8);
    if (p.pick) up(8);
    if (p.key) up(14);
    const ps = p.play.filter(i => V[i].some(e => e.p.length));
    if (ps.length > 1) up(9);
    ps.forEach(i => V[i].forEach(e => {
      e.p.forEach(m => up(NOTE_CH[m] || 14));
      if (e.p.length >= 3) up(11); else if (e.p.length === 2) up(9);
      const d = e.d;
      if (!e.p.length) up(d >= 2 ? 5 : 6);
      else if (Math.abs(d - 2) < 1e-6) up(5);
      else if (Math.abs(d - 4) < 1e-6) up(6);
      else if (Math.abs(d - 3) < 1e-6) up(8);
      else if (Math.abs(d - 1) > 1e-6) up(d < 1 && Math.abs(d - .5) < 1e-6 ? 12 : 13);
      if (e.tie) up(13);
    }));
    if (ps.length > 1) { const low = ps.map(i => V[i]).flat().filter(e => e.p.length).map(e => e.p[0]); if (low.some(m => m < 55 && ![40, 45, 50].includes(m))) up(10); }
    return lv;
  }

        /* a part of its own: what slavery was, told for children */
        P("Before we play Escravos de Jó", ["Our next song is a game song from Brazil: “Escravos de Jó”. “Escravos” means “slaves”.",

        P("What was slavery?", ["A slave was a person who was treated as if they belonged to someone else, like a thing. Enslaved people had to work all day without pay. They could not go where they wanted, and they could be sold and taken away from their families.",
          "For more than 300 years, millions of people from Africa were enslaved in the Americas. It was one of the greatest injustices in history. Today slavery is forbidden by law in every country in the world."], { story: true, ill: "timeline" }),
        P("Ships across the ocean", ["Look at the map. From the 1500s on, ships sailed from Europe: from Portugal, Spain, England, France and the Netherlands. They went down to the coast of Africa and stopped at ports and forts, like Elmina in today's Ghana or Luanda in today's Angola.",
          "There, people who had been captured in wars and raids were sold to the Europeans. They were chained in the dark, crowded hold of the ships and carried across the Atlantic Ocean, to Brazil, to the islands of the Caribbean and to North America. The crossing took many weeks, and many people died on the way.",
          "In the Americas they were sold again, to work on plantations of sugar, coffee, cotton and tobacco, and in the gold mines, like here in Minas Gerais. Then the ships sailed back to Europe, full of sugar, gold and cotton."], { story: true, ill: "slaveMap" }),
        P("Brazil and the Valongo Wharf", ["About 12 million people were taken from Africa across the ocean. About four in every ten were brought to Brazil: more than to any other country.",
          "In Rio de Janeiro, hundreds of thousands of Africans arrived at the Valongo Wharf. Its old stones were found again in 2011, and today it is a World Heritage site: a place to remember."], { story: true, ill: "ship", photo: { file: "valongo.jpg", draw: "valongo", cap: "The Valongo Wharf in Rio de Janeiro today" } }),
        P("They never gave up", ["Enslaved people never accepted slavery. They kept their languages, their faith, their dances and their music, even when this was forbidden. Some ran away and built free villages in the forests, called quilombos.",
          "The biggest quilombo, Palmares, lasted almost 100 years. Its last leader, Zumbi, died fighting in 1695. Today the day of his death is a holiday in Brazil: the Day of Zumbi and of Black Consciousness."], { story: true, ill: "quilombo" }),
        P("Freedom, and after", ["Little by little, people fought to end slavery: the enslaved people themselves, and many free people who helped them. In Brazil slavery ended in 1888, with a law called the Lei Áurea, the “Golden Law”. Brazil was the last country in the Americas to end it.",
          "The freed people did not get land, schools or help, so life stayed very hard for their children and grandchildren. That is why we remember, and why it matters to treat everyone fairly."], { story: true, photo: { file: "abolicao1888.jpg", draw: "abolicao", cap: "Rio de Janeiro, 1888: thousands of people celebrate the end of slavery" } }),
        P("Music that crossed the ocean", ["The Africans brought their music with them, and it changed the music of the whole continent. Samba, capoeira and maracatu in Brazil, spirituals, blues and jazz in the United States, and many other kinds of music have African roots.",
          "Escravos de Jó is played by children all over Brazil, passing stones in a circle to the beat. Nobody knows for sure how the song was born. In Bahia people tell that enslaved people used the game to plan their escapes. When we play it, we can remember them."], { story: true, ill: "berimbau", photo: { file: "capoeira.jpg", draw: "capoeira", cap: "A capoeira roda, with berimbaus, pandeiro and atabaque drum" } })

  testIntro: ["Placement test: {n} phrases, no hints, {h} hearts. Pass it and everything up to here opens.", "Einstufungstest: {n} Phrasen, keine Tipps, {h} Herzen. Bestehst du, ist alles bis hierher frei.", "Test di livello: {n} frasi, niente aiuti, {h} cuori. Se lo superi, si sblocca tutto fino a qui.", "Test de niveau : {n} phrases, sans indices, {h} cœurs. Réussis-le et tout s'ouvre jusqu'ici.", "Teste de nivelamento: {n} frases, sem dicas, {h} corações. Passou, tudo até aqui fica liberado."],

  lvlD0: ["I'm starting out. We begin with the notes in open position.", "Ich fange an. Wir beginnen mit den Tönen in der 1. Lage.", "Comincio ora. Partiamo dalle note in prima posizione.", "Je débute. On commence par les notes en première position.", "Estou começando. Começamos pelas notas da primeira posição."],
  lvlD1: ["I know some chords and scales. We start with the five pentatonic shapes.", "Ich kenne ein paar Akkorde und Tonleitern. Wir starten mit den fünf Pentatonik-Shapes.", "Conosco qualche accordo e scala. Partiamo dai cinque shape della pentatonica.", "Je connais quelques accords et gammes. On commence par les cinq positions de la pentatonique.", "Conheço alguns acordes e escalas. Começamos pelos cinco shapes da pentatônica."],

  /* intro story */
  i1t: ["Meet Capy", "Das ist Capy", "Ecco Capy", "Voici Capy", "Esta é a Capy"],
  i1x: ["Capy is a capybara, the most relaxed animal on the planet. Birds sit on her head, monkeys nap on her back, and even crocodiles ask her for relaxation tips.",
        "Capy ist ein Capybara, das entspannteste Tier der Welt. Vögel sitzen auf ihrem Kopf, Affen machen auf ihrem Rücken ein Nickerchen, und sogar Krokodile fragen sie nach Entspannungstipps.",
        "Capy è una capibara, l'animale più rilassato del pianeta. Gli uccellini le si siedono in testa, le scimmie fanno il pisolino sulla sua schiena e perfino i coccodrilli le chiedono consigli per rilassarsi.",
        "Capy est un capybara, l'animal le plus zen de la planète. Les oiseaux se posent sur sa tête, les singes font la sieste sur son dos, et même les crocodiles lui demandent des conseils de relaxation.",
        "A Capy é uma capivara, o bicho mais tranquilo do planeta. Passarinho senta na cabeça dela, macaco tira soneca nas costas dela, e até jacaré pede dica de relaxamento."],
  i2t: ["A world-famous star", "Ein Weltstar", "Una star mondiale", "Une star mondiale", "Uma estrela mundial"],
  i2x: ["Capy is also a very famous musician. She has toured every country on Earth, playing concerts for capybaras (and a few confused ducks). Her fans throw oranges instead of flowers. She wears the best one as a hat.",
        "Capy ist außerdem eine sehr berühmte Musikerin. Sie war in jedem Land der Erde auf Tournee und hat Konzerte für Capybaras gespielt (und für ein paar verwirrte Enten). Ihre Fans werfen Orangen statt Blumen. Die schönste trägt sie als Hut.",
        "Capy è anche una musicista famosissima. Ha fatto tournée in ogni paese del mondo, suonando per altre capibara (e qualche anatra confusa). I fan le lanciano arance invece dei fiori. La più bella la porta come cappello.",
        "Capy est aussi une musicienne très célèbre. Elle a fait des tournées dans tous les pays du monde, en jouant pour d'autres capybaras (et quelques canards perplexes). Ses fans lui lancent des oranges au lieu de fleurs. La plus belle, elle la porte comme chapeau.",
        "A Capy também é uma musicista famosíssima. Já fez turnê por todos os países do mundo, tocando para outras capivaras (e alguns patos confusos). Os fãs jogam laranjas em vez de flores. A mais bonita ela usa como chapéu."],
  i3t: ["The brilliant idea", "Die geniale Idee", "L'idea geniale", "L'idée géniale", "A ideia brilhante"],
  i3x: ["After 1,000 concerts and 3 encores inside a hot spring, Capy had a brilliant idea: “What if I taught others to play everything they hear?” She packed her guitar, her orange and the songs she collected on the road.",
        "Nach 1.000 Konzerten und 3 Zugaben in einer heißen Quelle hatte Capy eine geniale Idee: „Was, wenn ich anderen beibringe, alles zu spielen, was sie hören?“ Sie packte ihre Gitarre, ihre Orange und die Lieder, die sie unterwegs gesammelt hat.",
        "Dopo 1.000 concerti e 3 bis dentro una sorgente termale, Capy ha avuto un'idea geniale: «E se insegnassi agli altri a suonare tutto quello che sentono?» Ha preso la chitarra, la sua arancia e le canzoni raccolte in viaggio.",
        "Après 1 000 concerts et 3 rappels dans une source chaude, Capy a eu une idée géniale : « Et si j'apprenais aux autres à jouer tout ce qu'ils entendent ? » Elle a pris sa guitare, son orange et les chansons récoltées en route.",
        "Depois de 1.000 shows e 3 bis dentro de uma fonte termal, a Capy teve uma ideia brilhante: “E se eu ensinasse os outros a tocar tudo o que escutam?” Pegou o violão, a laranja e as músicas que juntou pelo caminho."],
  i4t: ["Songs with roots", "Lieder mit Wurzeln", "Canzoni con radici", "Des chansons avec des racines", "Músicas com raízes"],
  i4x: ["On her travels Capy learned that every melody comes from somewhere: from people who sang while working, playing, resisting, celebrating. Many of these songs travelled the world without their names. Here you learn them by ear first, and then Capy tells you where they come from.",
        "Auf ihren Reisen hat Capy gelernt: Jede Melodie kommt von irgendwoher, von Menschen, die bei der Arbeit, beim Spielen, im Widerstand und beim Feiern gesungen haben. Viele dieser Lieder sind ohne ihre Namen um die Welt gereist. Hier lernst du sie zuerst nach Gehör, und dann erzählt dir Capy, woher sie kommen.",
        "In viaggio Capy ha imparato che ogni melodia viene da qualche parte: da persone che cantavano lavorando, giocando, resistendo, festeggiando. Molte di queste canzoni hanno girato il mondo senza i loro nomi. Qui le impari prima a orecchio, poi Capy ti racconta da dove vengono.",
        "En voyage, Capy a appris que chaque mélodie vient de quelque part : de gens qui chantaient en travaillant, en jouant, en résistant, en faisant la fête. Beaucoup de ces chansons ont fait le tour du monde sans leurs noms. Ici, tu les apprends d'abord à l'oreille, puis Capy te raconte d'où elles viennent.",
        "Viajando, a Capy aprendeu que toda melodia vem de algum lugar: de gente que cantava trabalhando, brincando, resistindo, celebrando. Muitas dessas músicas rodaram o mundo sem o nome de quem as criou. Aqui você aprende primeiro de ouvido, e depois a Capy conta de onde elas vêm."],

  /* comic-book intro: caption (c) and speech balloon (b) per panel */
  c1: ["We capybaras come from South and Central America: Brazil, Argentina, Colombia, Venezuela, Peru, Paraguay, Uruguay, Panama… Our name comes from Tupi, an Indigenous language of Brazil, and means “grass eater”.",
       "Wir Capybaras kommen aus Süd- und Mittelamerika: Brasilien, Argentinien, Kolumbien, Venezuela, Peru, Paraguay, Uruguay, Panama… Unser Name stammt aus dem Tupi, einer indigenen Sprache Brasiliens, und bedeutet „Grasfresser“.",
       "Noi capibara veniamo dal Sud e dal Centro America: Brasile, Argentina, Colombia, Venezuela, Perù, Paraguay, Uruguay, Panama… Il nostro nome viene dal tupi, una lingua indigena del Brasile, e vuol dire «mangiatore d'erba».",
       "Nous, les capybaras, venons d'Amérique du Sud et d'Amérique centrale : Brésil, Argentine, Colombie, Venezuela, Pérou, Paraguay, Uruguay, Panama… Notre nom vient du tupi, une langue autochtone du Brésil, et veut dire « mangeur d'herbe ».",
       "Nós, capivaras, viemos da América do Sul e da América Central: Brasil, Argentina, Colômbia, Venezuela, Peru, Paraguai, Uruguai, Panamá… Nosso nome vem do tupi, uma língua indígena do Brasil, e quer dizer “comedor de capim”."],
  b1: ["Hi! I'm from the Pantanal!", "Hallo! Ich komme aus dem Pantanal!", "Ciao! Vengo dal Pantanal!", "Salut ! Je viens du Pantanal !", "Oi! Eu sou do Pantanal!"],
  c2: ["We live near rivers, lakes and swamps. We have webbed toes, swim very well and can stay underwater for up to five minutes.",
       "Wir leben an Flüssen, Seen und Sümpfen. Wir haben Schwimmhäute zwischen den Zehen, schwimmen super und können bis zu fünf Minuten unter Wasser bleiben.",
       "Viviamo vicino a fiumi, laghi e paludi. Abbiamo le dita palmate, nuotiamo benissimo e possiamo stare sott'acqua fino a cinque minuti.",
       "Nous vivons près des rivières, des lacs et des marais. Nous avons les doigts palmés, nous nageons très bien et pouvons rester sous l'eau jusqu'à cinq minutes.",
       "Vivemos perto de rios, lagos e brejos. Temos membrana entre os dedos, nadamos muito bem e aguentamos até cinco minutos embaixo d'água."],
  b2: ["Blub blub!", "Blubb blubb!", "Blub blub!", "Blub blub !", "Blub blub!"],
  c3: ["We are the largest rodents in the world: an adult weighs 35 to 65 kg, about as much as a grown-up person.",
       "Wir sind die größten Nagetiere der Welt: Ein erwachsenes Tier wiegt 35 bis 65 kg, ungefähr so viel wie ein erwachsener Mensch.",
       "Siamo i roditori più grandi del mondo: un adulto pesa da 35 a 65 kg, più o meno quanto una persona adulta.",
       "Nous sommes les plus gros rongeurs du monde : un adulte pèse de 35 à 65 kg, à peu près autant qu'une personne adulte.",
       "Somos os maiores roedores do mundo: uma capivara adulta pesa de 35 a 65 kg, mais ou menos o mesmo que uma pessoa adulta."],
  b3: ["It's all fluff!", "Das ist alles nur Fell!", "È tutto pelo!", "C'est que du poil !", "É tudo pelo!"],
  c4: ["We eat grass and water plants: about 3 kg a day. That's a lot of salad!",
       "Wir fressen Gras und Wasserpflanzen: etwa 3 kg am Tag. Das ist ganz schön viel Salat!",
       "Mangiamo erba e piante acquatiche: circa 3 kg al giorno. È un sacco di insalata!",
       "Nous mangeons de l'herbe et des plantes aquatiques : environ 3 kg par jour. Ça fait beaucoup de salade !",
       "Comemos capim e plantas aquáticas: uns 3 kg por dia. É muita salada!"],
  b4: ["Mmm, fresh grass!",
       "Mmm, frisches Gras!",
       "Mmm, erba fresca!",
       "Miam, de l'herbe fraîche !",
       "Hmm, capim fresquinho!"],
  c5: ["We are so calm that birds ride on our backs. In the dry season we live in groups of up to a hundred capybaras.",
       "Wir sind so entspannt, dass Vögel auf unserem Rücken mitreiten. In der Trockenzeit leben wir in Gruppen von bis zu hundert Tieren.",
       "Siamo così tranquilli che gli uccellini viaggiano sulla nostra schiena. Nella stagione secca viviamo in gruppi fino a cento capibara.",
       "Nous sommes si calmes que les oiseaux voyagent sur notre dos. À la saison sèche, nous vivons en groupes qui peuvent atteindre cent capybaras.",
       "Somos tão calmas que os passarinhos pegam carona nas nossas costas. Na seca, vivemos em grupos de até cem capivaras."],
  b5: ["Next stop: the river!", "Nächster Halt: der Fluss!", "Prossima fermata: il fiume!", "Prochain arrêt : la rivière !", "Próxima parada: o rio!"],
  c6: ["But there's something about me that you don't know…",
       "Aber es gibt etwas über mich, das du nicht weißt…",
       "Ma c'è una cosa di me che non sai…",
       "Mais il y a une chose que tu ne sais pas sur moi…",
       "Mas tem uma coisa sobre mim que você não sabe…"],
  b6: ["Shh… listen!",
       "Pssst… hör mal!",
       "Sst… ascolta!",
       "Chut… écoute !",
       "Psiu… escuta!"],
  c7: ["I'm Capy, and you probably didn't know this, but I became a successful musician all over the world! I've played concerts in every country. My fans throw oranges instead of flowers; I wear the best one as a hat.",
       "Ich bin Capy, und das weißt du wahrscheinlich nicht: Ich bin auf der ganzen Welt eine erfolgreiche Musikerin geworden! Ich habe in jedem Land Konzerte gegeben. Meine Fans werfen Orangen statt Blumen; die schönste trage ich als Hut.",
       "Sono Capy e probabilmente non lo sai, ma sono diventata una musicista di successo in tutto il mondo! Ho fatto concerti in ogni paese. I miei fan lanciano arance invece dei fiori; la più bella la porto come cappello.",
       "Je suis Capy, et tu ne le sais sûrement pas, mais je suis devenue une musicienne célèbre dans le monde entier ! J'ai donné des concerts dans tous les pays. Mes fans lancent des oranges au lieu de fleurs ; la plus belle, je la porte comme chapeau.",
       "Eu sou a Capy e você não deve saber, mas eu me tornei uma musicista de sucesso no mundo todo! Já fiz shows em todos os países. Os fãs jogam laranjas em vez de flores; a mais bonita eu uso como chapéu."],
  b7: ["Thank you, Pantanal!", "Danke, Pantanal!", "Grazie, Pantanal!", "Merci, Pantanal !", "Valeu, Pantanal!"],
  c8: ["And now I've decided to help people learn the instrument too, with the songs I collected along the way. Songs with roots, from people who sang while working, playing, resisting and celebrating. You learn them by ear first; the story comes at the end.",
       "Und jetzt habe ich beschlossen, auch Menschen beim Lernen des Instruments zu helfen, mit den Liedern, die ich unterwegs gesammelt habe. Lieder mit Wurzeln, von Menschen, die bei der Arbeit, beim Spielen, im Widerstand und beim Feiern gesungen haben. Du lernst sie zuerst nach Gehör; die Geschichte kommt am Ende.",
       "E adesso ho deciso di aiutare anche le persone a imparare lo strumento, con le canzoni che ho raccolto in viaggio. Canzoni con radici, di persone che cantavano lavorando, giocando, resistendo e festeggiando. Prima le impari a orecchio; la storia arriva alla fine.",
       "Et maintenant, j'ai décidé d'aider les gens à apprendre l'instrument, avec les chansons récoltées en route. Des chansons avec des racines, de gens qui chantaient en travaillant, en jouant, en résistant et en faisant la fête. Tu les apprends d'abord à l'oreille ; l'histoire arrive à la fin.",
       "E agora eu resolvi ajudar as pessoas a aprender o instrumento também, com as músicas que juntei pelo caminho. Músicas com raízes, de gente que cantava trabalhando, brincando, resistindo e celebrando. Primeiro você aprende de ouvido; a história vem no final."],
  b8: ["Shall we start?", "Fangen wir an?", "Cominciamo?", "On commence ?", "Vamos começar?"],
  learnSlaveryT: ["To understand: enslavement", "Zum Verstehen: Versklavung", "Per capire: la schiavitù", "Pour comprendre : l'esclavage", "Para entender: a escravidão"],
  learnSlavery: ["Between 1501 and 1866, about 12.5 million African women, men and children were captured and forced onto ships across the Atlantic. Almost 2 million died during the crossing. In the Americas they were forced to work without pay and without freedom: on plantations, in mines, in houses. Brazil received the most people of all, almost 5 million, and was the last country in the Americas to end slavery, in 1888. We say “enslaved people”, not “slaves”: slavery was something done to them, not who they were. And they resisted: they escaped and built free communities, like the quilombos in Brazil, and kept their languages, beliefs and music alive. Songs like this one carry that memory.",
                 "Zwischen 1501 und 1866 wurden etwa 12,5 Millionen afrikanische Frauen, Männer und Kinder gefangen genommen und auf Schiffen über den Atlantik verschleppt. Fast 2 Millionen starben auf der Überfahrt. In Amerika mussten sie ohne Lohn und ohne Freiheit arbeiten: auf Plantagen, in Minen, in Häusern. Brasilien nahm die meisten Menschen auf, fast 5 Millionen, und schaffte die Sklaverei 1888 als letztes Land Amerikas ab. Wir sagen „versklavte Menschen“ und nicht „Sklaven“: Die Sklaverei wurde ihnen angetan, sie war nicht, wer sie waren. Und sie leisteten Widerstand: Sie flohen und gründeten freie Gemeinschaften, etwa die Quilombos in Brasilien, und bewahrten ihre Sprachen, ihren Glauben und ihre Musik. Lieder wie dieses tragen diese Erinnerung weiter.",
                 "Tra il 1501 e il 1866 circa 12,5 milioni di donne, uomini e bambini africani furono catturati e portati a forza su navi attraverso l'Atlantico. Quasi 2 milioni morirono durante la traversata. Nelle Americhe erano costretti a lavorare senza paga e senza libertà: nelle piantagioni, nelle miniere, nelle case. Il Brasile ricevette più persone di tutti, quasi 5 milioni, e fu l'ultimo paese delle Americhe ad abolire la schiavitù, nel 1888. Diciamo «persone schiavizzate» e non «schiavi»: la schiavitù è qualcosa che è stato fatto a loro, non ciò che erano. E resistettero: fuggirono e costruirono comunità libere, come i quilombos in Brasile, e mantennero vive le loro lingue, credenze e musiche. Canzoni come questa custodiscono quella memoria.",
                 "Entre 1501 et 1866, environ 12,5 millions de femmes, d'hommes et d'enfants africains ont été capturés et emmenés de force sur des navires à travers l'Atlantique. Près de 2 millions sont morts pendant la traversée. Aux Amériques, ils étaient forcés de travailler sans salaire et sans liberté : dans les plantations, les mines, les maisons. Le Brésil a reçu le plus de personnes, près de 5 millions, et a été le dernier pays des Amériques à abolir l'esclavage, en 1888. On dit « personnes mises en esclavage » et pas « esclaves » : l'esclavage est ce qu'on leur a fait subir, pas ce qu'elles étaient. Et elles ont résisté : elles se sont enfuies et ont créé des communautés libres, comme les quilombos au Brésil, et ont gardé vivants leurs langues, leurs croyances et leur musique. Des chansons comme celle-ci portent cette mémoire.",
                 "Entre 1501 e 1866, cerca de 12,5 milhões de mulheres, homens e crianças africanas foram capturados e levados à força em navios pelo Atlântico. Quase 2 milhões morreram na travessia. Nas Américas, eram obrigados a trabalhar sem salário e sem liberdade: em plantações, minas e casas. O Brasil foi o país que mais recebeu pessoas, quase 5 milhões, e o último das Américas a acabar com a escravidão, em 1888. Dizemos “pessoas escravizadas”, e não “escravos”: a escravidão foi algo feito com elas, não o que elas eram. E elas resistiram: fugiram e construíram comunidades livres, como os quilombos, e mantiveram vivas suas línguas, crenças e músicas. Músicas como esta guardam essa memória."],

  tchPitch: ["Create classes, invite your students with a link or QR code, and see how long and what each of them practises at home.", "Erstelle Klassen, lade deine Schüler:innen per Link oder QR-Code ein und sieh, wie lange und was sie zu Hause üben.", "Crea classi, invita i tuoi allievi con un link o un codice QR e guarda quanto e cosa studiano a casa.", "Crée des classes, invite tes élèves avec un lien ou un code QR et vois combien de temps et quoi ils travaillent à la maison.", "Crie turmas, convide seus alunos com link ou QR code e veja quanto tempo e o que cada um estuda em casa."],
  tchProto: ["Prototype: everything is saved only in this browser. Students on other devices can send you their progress with a link; automatic syncing needs a server (next step).", "Prototyp: Alles wird nur in diesem Browser gespeichert. Schüler:innen auf anderen Geräten können dir ihren Fortschritt per Link schicken; automatische Synchronisation braucht einen Server (nächster Schritt).", "Prototipo: tutto è salvato solo in questo browser. Gli allievi su altri dispositivi possono mandarti i progressi con un link; la sincronizzazione automatica richiede un server (prossimo passo).", "Prototype : tout est enregistré uniquement dans ce navigateur. Les élèves sur d'autres appareils peuvent t'envoyer leurs progrès par un lien ; la synchronisation automatique demande un serveur (prochaine étape).", "Protótipo: tudo fica salvo só neste navegador. Alunos em outros aparelhos podem te mandar o progresso por um link; a sincronização automática precisa de um servidor (próximo passo)."],

  inviteTxt: ["Send this link or show the QR code. Students choose a nickname and join the class.", "Schick diesen Link oder zeig den QR-Code. Die Schüler:innen wählen einen Spitznamen und treten der Klasse bei.", "Manda questo link o mostra il codice QR. Gli allievi scelgono un soprannome ed entrano nella classe.", "Envoie ce lien ou montre le code QR. Les élèves choisissent un pseudo et rejoignent la classe.", "Mande este link ou mostre o QR code. O aluno escolhe um apelido e entra na turma."],

  appUrlS: ["This file is on your computer, so its links only work here. Put Capy online (e.g. Netlify Drop, free) and paste the address here, so phones can open the links.", "Diese Datei liegt auf deinem Computer, daher funktionieren ihre Links nur hier. Stell Capy online (z. B. Netlify Drop, gratis) und füg die Adresse hier ein, damit Handys die Links öffnen können.", "Questo file è sul tuo computer, quindi i suoi link funzionano solo qui. Metti Capy online (es. Netlify Drop, gratis) e incolla qui l'indirizzo, così i telefoni potranno aprire i link.", "Ce fichier est sur ton ordinateur, donc ses liens ne marchent qu'ici. Mets Capy en ligne (ex. Netlify Drop, gratuit) et colle l'adresse ici, pour que les téléphones puissent ouvrir les liens.", "Este arquivo está no seu computador, então os links dele só funcionam aqui. Coloque o Capy online (ex.: Netlify Drop, grátis) e cole o endereço aqui, para os celulares abrirem os links."],

  importNote: ["Students can also send you their progress with a link (button “Send progress to my teacher”). When you open that link in this browser, it updates this list.", "Schüler:innen können dir ihren Fortschritt auch per Link schicken (Knopf „Fortschritt an meine Lehrperson senden“). Öffnest du den Link in diesem Browser, wird die Liste aktualisiert.", "Gli allievi possono anche mandarti i progressi con un link (pulsante «Invia i progressi al mio insegnante»). Se apri quel link in questo browser, la lista si aggiorna.", "Les élèves peuvent aussi t'envoyer leurs progrès par un lien (bouton « Envoyer mes progrès à mon prof »). Quand tu ouvres ce lien dans ce navigateur, la liste se met à jour.", "O aluno também pode mandar o progresso por um link (botão “Enviar progresso ao professor”). Quando você abre esse link neste navegador, a lista é atualizada."],

  iHi: ["Hi! I'm Capy. That's my name because I'm a capybara. Let's start with a few questions to see if you know a little about me!", "Hallo! Ich bin Capy. So heiße ich, weil ich ein Capybara bin. Fangen wir mit ein paar Fragen an: Mal sehen, ob du schon ein bisschen über mich weißt!", "Ciao! Sono Capy. Mi chiamo così perché sono un capibara. Cominciamo con qualche domanda, per vedere se sai già qualcosa di me!", "Salut ! Je suis Capy. Je m'appelle comme ça parce que je suis un capybara. On commence par quelques questions pour voir si tu sais déjà un peu qui je suis !", "Oi! Eu sou a Capy. Esse é o meu nome porque eu sou uma capivara. Vamos começar com umas perguntas para ver se você sabe um pouco sobre mim!"],

  betaP: ["This is a beta version with only the first lessons. If you'd like to use Capy (as a student, a teacher or a school) or want to tell me what you think, write to me.", "Das ist eine Beta-Version mit den ersten Lektionen. Wenn du Capy nutzen möchtest (als Schüler·in, Lehrperson oder Musikschule) oder mir sagen willst, wie du es findest, schreib mir.", "Questa è una versione beta con solo le prime lezioni. Se ti interessa usare Capy (come studente, insegnante o scuola) o vuoi dirmi cosa ne pensi, scrivimi.", "Ceci est une version bêta avec seulement les premières leçons. Si tu veux utiliser Capy (comme élève, enseignant·e ou école) ou me dire ce que tu en penses, écris-moi.", "Esta é uma versão beta, só com as primeiras lições. Se você tem interesse em usar o Capy (como aluno, professor ou escola) ou quer me contar o que achou, me escreva."],

  soonP: ["{e} ear-training lessons and {r} reading lessons, songs from many parts of the world with a map and their story, a metronome for rhythm, and a space where teachers can follow their students.", "{e} Gehörbildungs- und {r} Leselektionen, Lieder aus vielen Teilen der Welt mit Karte und Geschichte, ein Metronom für den Rhythmus und ein Bereich, in dem Lehrpersonen ihre Schüler·innen begleiten können.", "{e} lezioni di orecchio e {r} di lettura, canzoni da tante parti del mondo con mappa e storia, un metronomo per il ritmo e uno spazio dove gli insegnanti seguono i propri studenti.", "{e} leçons d'oreille et {r} de lecture, des chansons de nombreuses régions du monde avec carte et histoire, un métronome pour le rythme et un espace où les enseignant·es suivent leurs élèves.", "{e} lições de ouvido e {r} de leitura, músicas de vários lugares do mundo com mapa e história, metrônomo para o ritmo e um espaço para professores acompanharem seus alunos."],

  inst_nylon: ["Acoustic guitar", "Akustikgitarre", "Chitarra acustica", "Guitare acoustique", "Violão"],

  instOk: ["Nice! Capy's sounds now match your instrument.", "Super! Capys Klänge passen jetzt zu deinem Instrument.", "Bene! Ora i suoni di Capy sono come il tuo strumento.", "Super ! Les sons de Capy correspondent maintenant à ton instrument.", "Boa! Agora os sons da Capy combinam com o seu instrumento."],

  /* tuning */
  tuneTitle: ["Before we start: tune up!", "Bevor wir anfangen: stimmen!", "Prima di iniziare: accordiamo!", "Avant de commencer : on s'accorde !", "Antes de começar: vamos afinar!"],
  tuneSay: ["Not even Capy sounds good on an out-of-tune instrument. We go string by string, from the thickest (6th) to the thinnest (1st).", "Nicht einmal Capy klingt gut auf einem verstimmten Instrument. Wir stimmen Saite für Saite, von der dicksten (6.) bis zur dünnsten (1.).", "Nemmeno Capy suona bene con uno strumento scordato. Andiamo corda per corda, dalla più grossa (6ª) alla più sottile (1ª).", "Même Capy ne sonne pas bien sur un instrument désaccordé. On y va corde par corde, de la plus grosse (6e) à la plus fine (1re).", "Nem a Capy soa bem num instrumento desafinado. Vamos corda por corda, da mais grossa (6ª) até a mais fina (1ª)."],
  th1: ["Play the highlighted string open, without pressing any fret.", "Spiel die markierte Saite leer, ohne einen Bund zu greifen.", "Suona la corda evidenziata a vuoto, senza premere nessun tasto.", "Joue la corde surlignée à vide, sans appuyer sur aucune case.", "Toque a corda destacada solta, sem apertar nenhuma casa."],
  th2: ["Needle on the left: the note is too low. Tighten the string: turn the tuning peg slowly so the sound goes up.", "Nadel links: Der Ton ist zu tief. Spanne die Saite: Dreh den Wirbel langsam, sodass der Ton steigt.", "Ago a sinistra: la nota è troppo bassa. Tendi la corda: gira la chiavetta piano finché il suono sale.", "Aiguille à gauche : la note est trop basse. Tends la corde : tourne la mécanique doucement pour faire monter le son.", "Ponteiro à esquerda: a nota está grave demais. Aperte a corda: gire a tarraxa devagar para o som subir."],
  th3: ["Needle on the right: too high. Loosen the string a little, then come back up to the note.", "Nadel rechts: zu hoch. Lockere die Saite etwas und stimme dann wieder hinauf zum Ton.", "Ago a destra: troppo alta. Allenta un po' la corda, poi risali fino alla nota.", "Aiguille à droite : trop haute. Détends un peu la corde, puis remonte jusqu'à la note.", "Ponteiro à direita: aguda demais. Afrouxe um pouco a corda e depois suba de novo até a nota."],
  th4: ["Not sure which way to turn? Turn just a tiny bit while the string rings and watch the needle. Always finish by tuning up: the string stays in tune longer.", "Unsicher, in welche Richtung? Dreh nur ein winziges Stück, während die Saite klingt, und beobachte die Nadel. Stimm immer von unten an den Ton heran: So hält die Saite länger.", "Non sai da che parte girare? Gira pochissimo mentre la corda suona e guarda l'ago. Finisci sempre salendo verso la nota: la corda tiene più a lungo.", "Tu ne sais pas dans quel sens tourner ? Tourne très peu pendant que la corde sonne et regarde l'aiguille. Termine toujours en montant vers la note : la corde tient plus longtemps.", "Na dúvida para que lado girar? Gire só um pouquinho com a corda soando e olhe o ponteiro. Termine sempre subindo até a nota: a corda segura a afinação por mais tempo."],
  tuneString: ["String {s}", "Saite {s}", "Corda {s}", "Corde {s}", "Corda {s}"],
  tunePlay: ["Play the open string", "Spiel die leere Saite", "Suona la corda a vuoto", "Joue la corde à vide", "Toque a corda solta"],
  tuneLow: ["Too low: tighten ↑", "Zu tief: spannen ↑", "Troppo bassa: tendi ↑", "Trop bas : tends ↑", "Grave demais: aperte ↑"],
  tuneHigh: ["Too high: loosen ↓", "Zu hoch: lockern ↓", "Troppo alta: allenta ↓", "Trop haut : détends ↓", "Aguda demais: afrouxe ↓"],
  tuneHold: ["Almost… let it ring", "Fast… klingen lassen", "Quasi… lasciala suonare", "Presque… laisse sonner", "Quase… deixa soar"],
  tuneOk: ["In tune! ✓", "Gestimmt! ✓", "Accordata! ✓", "Accordée ! ✓", "Afinada! ✓"],
  tuneFar: ["I hear {n}, far from {t}. Is it the right string? If so, keep turning slowly.", "Ich höre {n}, weit weg von {t}. Ist es die richtige Saite? Dann langsam weiterdrehen.", "Sento {n}, lontano da {t}. È la corda giusta? Allora continua a girare piano.", "J'entends {n}, loin de {t}. C'est la bonne corde ? Alors continue à tourner doucement.", "Ouço {n}, longe de {t}. É a corda certa? Então continue girando devagar."],
  tuneRef: ["Hear the note", "Ton anhören", "Ascolta la nota", "Écouter la note", "Ouvir a nota"],
  tuneNext: ["Next string", "Nächste Saite", "Corda successiva", "Corde suivante", "Próxima corda"],
  tuneDone: ["All six strings in tune. Now Capy can hear you clearly!", "Alle sechs Saiten gestimmt. Jetzt hört Capy dich klar und deutlich!", "Tutte e sei le corde accordate. Ora Capy ti sente benissimo!", "Les six cordes sont accordées. Maintenant Capy t'entend parfaitement !", "As seis cordas afinadas. Agora a Capy te escuta direitinho!"],
  tuneNoMic: ["No microphone here. Tune with another tuner, then continue.", "Kein Mikrofon. Stimm mit einem anderen Stimmgerät und mach dann weiter.", "Niente microfono. Accorda con un altro accordatore, poi continua.", "Pas de micro. Accorde avec un autre accordeur, puis continue.", "Sem microfone. Afine com outro afinador e depois continue."],
  tuneSkip: ["Skip tuning", "Stimmen überspringen", "Salta l'accordatura", "Passer l'accordage", "Pular afinação"],

/* ---------------- microphone in ---------------- */
const Mic = {
  ok: false, active: false, tracker: new C.NoteTracker(3), floor: [], log: [],
  start() {
    if (this.p) return this.p;
    this.p = (async () => {
      const c = Audio.ensure();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
      catch (e) { return false; }
      const src = c.createMediaStreamSource(this.stream);
      this.an = c.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0; src.connect(this.an);
      this.spec = new Float32Array(1024); this.spec0 = new Float32Array(1024);
      this.an2 = c.createAnalyser(); this.an2.fftSize = 8192; src.connect(this.an2); this.buf2 = new Float32Array(8192);
      this.buf = new Float32Array(2048); this.ok = true;
      this.timer = setInterval(() => this.tick(), 25);
      return true;
    })();
    return this.p;
  },
  tick() {
    this.an.getFloatTimeDomainData(this.buf);
    const fr = C.analyzeFrame(this.buf, Audio.ctx.sampleRate);
    {   // relative spectral flux, 70 Hz - 3 kHz: how much new sound appeared since the last frame
      const sp = this.spec, s0 = this.spec0, bw = Audio.ctx.sampleRate / 2048; this.an.getFloatFrequencyData(sp);
      let up = 0, tot = 0;
      for (let k = Math.ceil(70 / bw), K = Math.floor(3000 / bw); k <= K; k++) { const a = Math.pow(10, sp[k] / 20), b = Math.pow(10, s0[k] / 20); if (a > b) up += a - b; tot += a; }
      fr.flux = tot > 0 ? up / tot : 0; this.spec0.set(sp);
    }
    this.floor.push(fr.rms); if (this.floor.length > 240) this.floor.shift();
    fr.gate = Math.min(.05, Math.max(.004, Math.min.apply(null, this.floor) * P.settings.sens + .002));
    onFrame(fr);
    if (this.active && P.settings.input === "mic" && !Voice.busy()) {
      const tr = this.tracker, on0 = tr.onsets, ev = tr.push(fr);
      if (tr.onsets !== on0 && L && L.book) bkOnset(tr.onsets);
      if (ev) { lastAct = Date.now(); this.log.push(ev.midi); if (this.log.length > 200) this.log.shift(); onNote(ev.midi, "mic"); }
      if (tr.since === 6 && L && L.book) bkPolyCheck(tr.onsets);   // ~150 ms after an attack: chords and notes over ringing strings
    }
  },
  listen(on, seed) { this.active = on; this.tracker.reset(); if (seed != null) { this.tracker.last = seed; this.tracker.armed = false; } }
};

/* ---------------- the neck, as the player sees it ---------------- */
function drawNeckFlat(el, o) {
  const W = el.clientWidth, H = el.clientHeight; if (!W) return;
  const player = P.settings.neck !== "chart", lefty = !!P.settings.lefty, narrow = W < 640;
  const lo = o.hi != null ? 0 : narrow ? Math.max(0, o.win[0] - 2) : 0, hi = o.hi != null ? o.hi : narrow ? Math.min(15, o.win[1] + 3) : 15;
  const labW = 20, openW = lo === 0 ? 32 : 0, xL = 6 + labW + openW, xR = W - 8, wS = lo === 0 ? 0 : lo - 1, xS = xL - openW;
  const pp = f => 1 - 2 ** (-f / 12), X = w => xL + (pp(w) - pp(wS)) / (pp(hi) - pp(wS)) * (xR - xL);
  const cx = f => f === 0 ? xL - openW / 2 : (X(f - 1) + X(f)) / 2;
  const gap = Math.min(26, (H - 66) / 5), yc = 30 + 2.5 * gap;
  const k = x => .84 + .16 * (x - xS) / (xR - xS);          // strings fan out toward the body
  const row = s => player ? 6 - s : s - 1;
  const Y = (s, x) => yc + (row(s) - 2.5) * gap * k(x);
  const E = (x, side) => yc + side * (2.5 * gap + 12) * k(x);
  const mx = x => lefty ? W - x : x;
  const pts = a => a.map(([x, y]) => mx(x).toFixed(1) + "," + y.toFixed(1)).join(" ");
  const ln = (x1, y1, x2, y2, st) => `<line x1="${mx(x1).toFixed(1)}" y1="${y1.toFixed(1)}" x2="${mx(x2).toFixed(1)}" y2="${y2.toFixed(1)}" ${st}/>`;
  const circ = (x, y, r, st) => `<circle cx="${mx(x).toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" ${st}/>`;
  let g = `<defs><linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c3426"/><stop offset="1" stop-color="#2c1711"/></linearGradient></defs>`;
  g += `<polygon points="${pts([[xL, E(xL, -1)], [xR, E(xR, -1)], [xR, E(xR, 1)], [xL, E(xL, 1)]])}" fill="url(#wd)"/>`;
  for (const f of [3, 5, 7, 9, 15]) if (f >= Math.max(lo, 1) && f <= hi) g += circ(cx(f), yc, 5, 'fill="#eadfce" opacity=".85"');
  if (12 >= lo && 12 <= hi) for (const sd of [-1, 1]) g += circ(cx(12), yc + sd * gap * k(cx(12)), 5, 'fill="#eadfce" opacity=".85"');
  if (o.box) {
    const x1 = o.win[0] === 0 ? xS + 2 : X(Math.max(o.win[0], lo + (lo ? 0 : 1)) - 1) + 2, x2 = X(Math.min(o.win[1], hi)) - 2;
    g += `<polygon points="${pts([[x1, E(x1, -1) + 2], [x2, E(x2, -1) + 2], [x2, E(x2, 1) - 2], [x1, E(x1, 1) - 2]])}" fill="#f2c14e" fill-opacity=".22" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<text x="${mx(x1 + 2)}" y="${E(x1, -1) - 7}" class="nl" text-anchor="${lefty ? "end" : "start"}">${esc(o.name)}</text>`;
  }
  for (let w = wS; w <= hi; w++) { const x = X(w); g += w === 0 ? `<polygon points="${pts([[x - 3, E(x, -1)], [x + 3, E(x, -1)], [x + 3, E(x, 1)], [x - 3, E(x, 1)]])}" fill="#efe6d6"/>` : ln(x, E(x, -1), x, E(x, 1), 'stroke="#cbc3ba" stroke-width="2.5"'); }
  const x0 = lo === 0 ? xS : xL;
  for (let s = 1; s <= 6; s++) {
    if (o.hiString === s) g += ln(x0, Y(s, x0), xR, Y(s, xR), 'stroke="#ff8a12" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"');
    g += ln(x0, Y(s, x0), xR, Y(s, xR), `stroke="#ece6de" stroke-width="${(0.7 + s * 0.35).toFixed(2)}"`);
    g += `<text x="${mx(6 + labW / 2)}" y="${(Y(s, x0) + 4).toFixed(1)}" class="sl"${o.hiString === s ? ' style="fill:var(--yuzuD);font-weight:800"' : ""}>${esc(nn(C.OPEN[s]))}</text>`;
  }
  for (const f of [0, 3, 5, 7, 9, 12, 15]) if (f >= lo && f <= hi) g += `<text x="${mx(cx(f)).toFixed(1)}" y="${(E(cx(f), 1) + 19).toFixed(1)}" class="fn">${f}</text>`;
  if (o.scale) for (let s = 1; s <= 6; s++) for (let f = o.win[0]; f <= o.win[1]; f++) if (f >= lo && f <= hi && o.pcs.includes(C.pc(C.OPEN[s] + f))) g += circ(cx(f), Y(s, cx(f)), 7.5, 'fill="#2c1711" stroke="#f2c14e" stroke-width="2"');
  const mr = Math.min(12, gap * .84 * .5 + 1);
  for (const m of o.marks || []) { if (m.f < lo || m.f > hi) continue; const col = m.kind === "first" ? "#2b7de9" : "#ff8a12", x = cx(m.f), y = Y(m.s, x);
    if (m.kind === "cand") { g += circ(x, y, mr, 'fill="#fffaf0" fill-opacity=".92" stroke="#7a5cff" stroke-width="2.5" stroke-dasharray="4 3"') + `<text x="${mx(x).toFixed(1)}" y="${(y + 4.5).toFixed(1)}" class="ml" style="fill:#5a3fd6">${esc(m.label)}</text>`; continue; }
    g += circ(x, y, mr, `fill="${col}" stroke="#fff" stroke-width="2"`) + `<text x="${mx(x).toFixed(1)}" y="${(y + 4.5).toFixed(1)}" class="ml"${m.label.length > 2 || mr < 11 ? ' style="font-size:9px"' : ""}>${esc(m.label)}</text>`; }
  if (o.ring) { const p = o.ring.s ? { s: o.ring.s, f: o.ring.f } : C.pos(o.ring.m, o.PO); if (p && p.f >= lo && p.f <= hi) g += circ(cx(p.f), Y(p.s, cx(p.f)), 15, `fill="none" stroke="${o.ring.ok ? "#2fd27a" : "#ff5a5f"}" stroke-width="4"`); }
  if (!o.noTap) for (let s = 1; s <= 6; s++) for (let f = lo; f <= hi; f++) {
    const x1 = f === 0 ? xS : X(f - 1), x2 = f === 0 ? xL : X(f), h1 = gap * k(x1) / 2, h2 = gap * k(x2) / 2;
    g += `<polygon data-act="tap" data-s="${s}" data-f="${f}" points="${pts([[x1, Y(s, x1) - h1], [x2, Y(s, x2) - h2], [x2, Y(s, x2) + h2], [x1, Y(s, x1) + h1]])}" fill="transparent"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("neckAria")}">${g}</svg>`;
}

/* ---------------- the staff (treble clef, guitar sounds an octave lower) ---------------- */
const CLEF = 'M13 31 C9 31 8 26 12 24 C18 21 23 27 21 33 C19 40 6 41 4 33 C2 25 10 17 15 11 C20 5 21 -6 17 -12 C14 -16 10 -10 11 -4 L16 48 C17 54 11 56 9 52';
function staffSvg(notes, durs, o) {
  o = o || {};
  const y0 = 40, Ys = st => y0 + (38 - st) * 5, steps = notes.map(C.staffStep);
  let x = o.meter ? 82 : 58, cum = 0, body = "";
  const col = i => i < (o.ok || 0) ? "var(--ok)" : i === o.cur ? "var(--yuzu)" : "var(--ink)";
  notes.forEach((m, i) => {
    const d = durs[i], st = steps[i], y = Ys(st), cxn = x + 12, c = col(i), filled = d < 2;
    if (i === o.cur) body += `<circle cx="${cxn}" cy="${y}" r="15" fill="var(--yuzu)" opacity=".16"/>`;
    for (let s = 28; s >= st; s -= 2) body += `<line x1="${cxn - 11}" x2="${cxn + 11}" y1="${Ys(s)}" y2="${Ys(s)}" stroke="var(--ink)" stroke-width="1.3"/>`;
    for (let s = 40; s <= st; s += 2) body += `<line x1="${cxn - 11}" x2="${cxn + 11}" y1="${Ys(s)}" y2="${Ys(s)}" stroke="var(--ink)" stroke-width="1.3"/>`;
    body += `<ellipse cx="${cxn}" cy="${y}" rx="6.3" ry="4.6" transform="rotate(-20 ${cxn} ${y})" fill="${filled ? c : "var(--card)"}" stroke="${c}" stroke-width="${filled ? 0 : 2}"/>`;
    if (d < 4) {
      const up = st < 34, sx = up ? cxn + 5.6 : cxn - 5.6, tip = up ? y - 33 : y + 33;
      body += `<line x1="${sx}" x2="${sx}" y1="${y + (up ? -1 : 1)}" y2="${tip}" stroke="${c}" stroke-width="1.6"/>`;
      const fl = d === .5 || d === .75 ? 1 : d === .25 ? 2 : 0;
      for (let k = 0; k < fl; k++) { const ty = tip + (up ? 1 : -1) * k * 7; body += up ? `<path d="M${sx} ${ty} c1 7 9 8 7 19 c-1 -7 -4 -9 -7 -11z" fill="${c}"/>` : `<path d="M${sx} ${ty} c1 -7 9 -8 7 -19 c-1 7 -4 9 -7 11z" fill="${c}"/>`; }
    }
    if ([.75, 1.5, 3].includes(d)) body += `<circle cx="${cxn + 11}" cy="${y - (st % 2 === 0 ? 2.5 : 0)}" r="1.9" fill="${c}"/>`;
    if (o.tim && o.tim[i] !== "ok") body += `<text x="${cxn}" y="131" text-anchor="middle" style="font:800 13px Fredoka,sans-serif;fill:var(--yuzuD)">${o.tim[i] === "early" ? "◀" : "▶"}</text>`;
    if (o.names) body += `<text x="${cxn}" y="146" text-anchor="middle" style="font:700 12px Nunito,sans-serif;fill:${c}">${esc(nn(m))}</text>`;
    const w = 28 + 13 * Math.min(d, 2);
    cum += d; x += w;
    const rel = cum - (o.pick || 0);
    if (o.meter && i < notes.length - 1 && rel > 1e-6 && Math.abs(rel / o.meter - Math.round(rel / o.meter)) < 1e-6) { body += `<line x1="${x - 2}" x2="${x - 2}" y1="${y0}" y2="${y0 + 40}" stroke="var(--ink)" stroke-width="1.3"/>`; x += 8; }
    else if (o.meter && i < notes.length - 1 && o.pick && Math.abs(cum - o.pick) < 1e-6) { body += `<line x1="${x - 2}" x2="${x - 2}" y1="${y0}" y2="${y0 + 40}" stroke="var(--ink)" stroke-width="1.3"/>`; x += 8; }
  });
  const Wd = Math.max(x + 14, o.minW || 0);
  let g = "";
  for (let k = 0; k < 5; k++) g += `<line x1="4" x2="${Wd - 4}" y1="${y0 + k * 10}" y2="${y0 + k * 10}" stroke="var(--ink)" stroke-width="1.1" opacity=".75"/>`;
  g += `<g transform="translate(10,${y0})"><path d="${CLEF}" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round"/><circle cx="9.6" cy="51" r="2.8" fill="var(--ink)"/><text x="9" y="66" text-anchor="middle" style="font:700 10px Nunito,sans-serif;fill:var(--ink)">8</text></g>`;
  if (o.meter) g += `<text x="52" y="${y0 + 17}" text-anchor="middle" style="font:700 19px Fredoka,sans-serif;fill:var(--ink)">${o.meter}</text><text x="52" y="${y0 + 37}" text-anchor="middle" style="font:700 19px Fredoka,sans-serif;fill:var(--ink)">4</text>`;
  g += `<line x1="${Wd - 5}" x2="${Wd - 5}" y1="${y0}" y2="${y0 + 40}" stroke="var(--ink)" stroke-width="2"/>`;
  const sc = o.scale || 1;
  return `<svg viewBox="0 0 ${Wd} 150" width="${Math.round(Wd * sc)}" height="${Math.round(150 * sc)}" role="img" aria-label="${t("staffAria")}">${g}${body}</svg>`;
}

    }
  } else { TU.hold = 0; msg.className = "tmsg " + (cents < 0 ? "lo" : "hi"); msg.textContent = t(cents < 0 ? "tuneLow" : "tuneHigh"); }
}

  tnext: () => { if (!TU) return; clearTimeout(TU.adv); TU.adv = null; TU.hold = 0; TU.hist = []; TU.i = (TU.i + 1) % 6; renderTune(null, true); },

  go: b => { P.onboarded = true; P.track = b.dataset.t; saveP(); const tr = P.track, j = nextIndex(tr); if (j >= 0) startLesson(TR[tr].lessons[j]); else renderHome(); },
  chear: () => { if (!L || !L.cards) return; const cd = L.cards[L.ci]; playNotes(cd.play || cd.staff || cd.neck); },
  cnext: () => { if (!L || !L.cards) return; if (++L.ci < L.cards.length) renderCard(); else startExercise(); window.scrollTo(0, 0); },
  playsong: b => { const id = b.dataset.s, ph = C.songPhrases(id, lastRes && lastRes.read && lastRes.song === id ? "read" : "ear"); Audio.ensure(); Audio.playPhrases(b.dataset.first ? ph.slice(0, 1) : ph, C.SONGS[id].drone, P.settings.bpm); },
  restart: () => { const m = document.getElementById("modal"); if (m) m.remove(); if (L) quit(); bkAbout(true); },
  replay: () => { const m = document.getElementById("modal"); if (m) m.remove(); if (L) quit(); renderIntro(0); },
  listen: () => { if (L && L.ex) playTarget(false); },
  countin: () => { if (!L || !L.ex || L.ex.done || L.counting) return; Object.assign(L.ex, { i: 0 }); L.ring = null; renderLesson(); countIn(P.settings.bpm).then(ok => { if (ok && L && L.ex) say(firstText() + " " + t("readGo"), "neutral"); }); },
  hint: b => {
    if (!L || !L.ex || L.ex.done || L.test) return; const k = b.dataset.k, ex = L.ex; ex.hints.add(k);
    if (k === "slow") { renderLesson(); return playTarget(true); }
    if (k === "hear") { renderLesson(); return playTarget(false); }
    if (k === "first") { ex.showFirst = true; Audio.ensure(); const was = Mic.active; Mic.listen(false); Audio.pluck(L.items[L.k].notes[0], Audio.ctx.currentTime + .05); setTimeout(() => { if (L && L.ex && !playing && !L.ex.done && was) Mic.listen(true, L.items[L.k].notes[0]); }, 600); }
    if (k === "contour") ex.contour = true;
    if (k === "region") ex.region = true;
    if (k === "names") ex.names = true;
    if (k === "where") ex.where = true;
    renderLesson();
  },
  reveal: () => { if (!L || !L.ex || L.ex.done || L.test) return; Object.assign(L.ex, { reveal: true, done: true, gained: 0, names: true }); L.reveals++; L.ring = null; Mic.listen(false); Audio.stopBacking(); L.status = t("answer"); renderLesson(); playTarget(false); },
  next: () => { if (!L || !L.ex) return; stopMetro(); playToken++; playing = false; Audio.fadePlayback(.1); Audio.stopBacking(); L.k++; if (L.k >= L.items.length) finishLesson(); else startExercise(); },
  quit, home: () => { if (L) quit(); else { if (TU) { clearTimeout(TU.adv); TU = null; } renderHome(); } },
  settings: () => renderSettings(), closeSettings,
  reset: b => { if (!resetArmed) { resetArmed = true; b.textContent = t("resetSure"); return; } const lang = P.settings.lang; P = JSON.parse(JSON.stringify(DEF)); P.settings.lang = lang; saveP(); const m = document.getElementById("modal"); if (m) m.remove(); renderIntro(0); },
  tap: b => { const s = +b.dataset.s, f = +b.dataset.f, m = C.OPEN[s] + f; Audio.ensure(); Audio.pluck(m, Audio.ctx.currentTime + .01, 1.2, .28); onNote(m, "tap", s, f); }
};

const Cloud = {
  load() { let d = null; try { d = JSON.parse(localStorage.getItem(CLOUD_KEY)); } catch (e) {} return d && typeof d === "object" ? Object.assign({ teacher: null, classes: [], url: "" }, d) : { teacher: null, classes: [], url: "" }; },
  save(d) { try { localStorage.setItem(CLOUD_KEY, JSON.stringify(d)); } catch (e) {} },

  push(sum, code) { const d = this.load(), c = d.classes.find(x => x.code === code); if (!c) return false; c.students[sum.sid] = Object.assign(c.students[sum.sid] || {}, sum); this.save(d); return true; }
};
const CODE_CH = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
